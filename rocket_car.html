    h += Math.sin(x*0.007*fm - y*0.006*fm + 1.3) * 14 * am;
    h += Math.sin(x*0.015*fm + y*0.013*fm + 2.7) * 8 * am;
    h += Math.sin(x*0.035*fm - y*0.03*fm + 0.5) * 4 * am;
    h += (hash(Math.floor(x*0.7), Math.floor(y*0.7))-0.5)*7;
    return h;
}

function worldToScreen(wx, wy) {
    const rx = wx - car.x, ry = wy - car.y;
    const cosA = Math.cos(car.angle), sinA = Math.sin(car.angle);
    const rrx = -rx*sinA + ry*cosA;
    const rry = -(rx*cosA + ry*sinA);
    const z = 1/(1 - rry*PERSP);
    const sx = W/2 + rrx*SCALE_BASE*z;
    const sy = HORIZON_Y + (CAR_BASE_Y - HORIZON_Y)*z;
    return {x:sx, y:sy, scale:SCALE_BASE*z, z:z, rry};
}

const TREE_CELL = 100, VIS_RANGE = 60;
function getTreeCells() {
    const cx = Math.floor(car.x/TREE_CELL), cy = Math.floor(car.y/TREE_CELL);
    const cells = [];
    for (let dx=-VIS_RANGE; dx<=VIS_RANGE; dx++) {
        for (let dy=-VIS_RANGE; dy<=VIS_RANGE; dy++) {
            const tx=cx+dx, ty=cy+dy;
            const wy = ty * TREE_CELL; // world Y of this cell
            if (getBiome(-wy/10).treeType === 'none') continue; // skip treeless biomes
            const density = treeDensity(Math.abs(wy) / 10);
            const h = hash(tx,ty);
            if (h < density) {
                const txW = tx*TREE_CELL + (hash(tx+0.5,ty)-0.5)*TREE_CELL*0.7;
                const tyW = wy + (hash(tx,ty+0.5)-0.5)*TREE_CELL*0.7;
                const r = 18 + hash(tx,ty+0.3)*20;
                cells.push({x:txW, y:tyW, r, shade:hash(tx+0.1,ty+0.1)});
            }
        }
    }
    return cells;
}

function persist() {
    putSave({ totalCoins, bestDist, currentLevel, activeCar, carUpgrades });
}

function circleCircle(a,b) { const dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy) < (a.r+b.r); }

let wakePoints = []; // {x, y, strength, age} for dynamic boat wake waves

function switchGameMode() {
    gameMode = gameMode==='land' ? 'water' : 'land';
    BIOMES = gameMode==='land' ? LAND_BIOMES : WATER_BIOMES;
    CAR_MODELS = gameMode==='land' ? LAND_VEHICLES : WATER_VEHICLES;
    wakePoints = [];
    const modeBtn = document.getElementById('mode-btn');
    modeBtn.textContent = gameMode==='land' ? '🏎️ Land' : '⛵ Wasser';
    modeBtn.style.background = gameMode==='land' ? 'rgba(200,80,40,.25)' : 'rgba(40,120,200,.25)';
    document.getElementById('car-icon').textContent = gameMode==='land' ? '🏎️' : '⛵';
    document.getElementById('car-name').textContent = getCarModel().name;
    document.getElementById('dist').textContent = '0';
}

// ── Physics ──
function update(dt) {
    if (state === 'ignition') {
        if (dt > 0.1) dt = 0.1;
        frame++;
        const cm = getCarModel();

        // ── Steering during ignition ──
        let turning = 0;
        if (keys['ArrowLeft']||keys['a']||keys['A']) turning = -1;
        if (keys['ArrowRight']||keys['d']||keys['D']) turning = 1;
        const targetTurnRate = turning * cm.turnSpeed;
        car.turnRate += (targetTurnRate - car.turnRate) * Math.min(1, 4.5*dt);
        car.angle += car.turnRate * dt;

        // ── Gas valve (ArrowUp/W or touch gas) ──
        if (keys['ArrowUp'] || keys['w'] || keys['W'] || touchGas) {
            gasValve = Math.min(1, gasValve + 0.9 * dt);
        }

        // ── Ignition trigger (Space or auto on mobile) ──
        if (gasValve > 0.15 && !ignitionTriggered && (keys[' '] || (isMobile && touchGas))) {
            ignitionTriggered = true;
            ignitionTimer = 0;
            initAudio(); startMusic();
            playRocket(0.1);
        }

        // ── Exhaust particles proportional to gasValve ──
        if (gasValve > 0.05) {
            const vol = ignitionTriggered ? gasValve : gasValve * 0.5;
            const bx = car.x - Math.cos(car.angle)*(car.height/2);
            const by = car.y - Math.sin(car.angle)*(car.height/2);
            const rate = Math.floor(vol * 6);
            for (let i=0;i<rate;i++) {
                const isSmoke = !ignitionTriggered || gasValve < 0.4;
                particles.push({
                    x:bx+(Math.random()-.5)*(isSmoke?22:14), y:by+(Math.random()-.5)*(isSmoke?22:14),
                    vx:-Math.cos(car.angle)*(isSmoke?10:35+Math.random()*50)*vol+car.vx*.2,
                    vy:-Math.sin(car.angle)*(isSmoke?10:35+Math.random()*50)*vol+car.vy*.2,
                    life:(isSmoke?0.7:0.35)+Math.random()*(isSmoke?1.0:0.5),
                    r:(isSmoke?6:2)+Math.random()*(isSmoke?8:3), smoke:isSmoke,
                });
            }
        }

        // ── Engine sound during ignition ──
        if (ignitionTriggered && gasValve < 1.0) {
            playRocket(gasValve * 0.6);
            ignitionTimer += dt;
            shakeI = Math.max(shakeI, gasValve * 4);
        }

        // ── Launch when gasValve reaches max ──
        if (gasValve >= 1.0) {
            state = 'playing';
            ignitionTimer = 1.5; // already past ignition ramp
            runStartTime = performance.now();
            lastTime = performance.now();
        }

        for (let i=particles.length-1;i>=0;i--) { particles[i].x+=particles[i].vx*dt; particles[i].y+=particles[i].vy*dt; particles[i].life-=dt; if (particles[i].life<=0) particles.splice(i,1); }
        if (shakeT>0) shakeT-=dt; shakeI*=0.88;
        document.getElementById('car-name').textContent = cm.name;
        document.getElementById('speed-val').textContent = '0';
        document.getElementById('hud-name').textContent = activeProfile||'—';
        document.getElementById('fuel-txt').textContent = fuel.toFixed(1);
        document.getElementById('fuel-bar').style.width = (fuel/getUpgradeVal('tank')*100)+'%';
        document.getElementById('coins').textContent = totalCoins+runCoins;
        document.getElementById('level-label').textContent = 'L'+currentLevel;
        return;
    }
    if (state !== 'playing') {
        if (state==='paused') {
            // Still update particles for visual effect
            for (let i=particles.length-1;i>=0;i--) { particles[i].life-=dt*0.3; if (particles[i].life<=0) particles.splice(i,1); }
        }
        return;
    }
    if (dt > 0.1) dt = 0.1;
    frame++;
    const cm = getCarModel();

    // ── Coasting after finish line ──
    if (coasting) {
        // Allow steering during coasting
        let turning = 0;
        if (keys['ArrowLeft']||keys['a']||keys['A']) turning = -1;
        if (keys['ArrowRight']||keys['d']||keys['D']) turning = 1;
        if (keys['touchLeft']) turning = -1;
        if (keys['touchRight']) turning = 1;
        const targetTurnRate = turning * cm.turnSpeed;
        car.turnRate += (targetTurnRate - car.turnRate) * Math.min(1, 4.5*dt);
        car.angle += car.turnRate * dt;
        let ad = car.angle - car.velAngle;
        while (ad>Math.PI) ad-=2*Math.PI;
        while (ad<-Math.PI) ad+=2*Math.PI;
        car.velAngle += ad * Math.min(1, 3.0*dt);

        car.speed -= cm.friction * dt;
        const h0 = getHeight(car.x, car.y), hx = getHeight(car.x+6, car.y), hy = getHeight(car.x, car.y+6);
        const slopeAlongDir = ((hx-h0)/6)*Math.cos(car.velAngle) + ((hy-h0)/6)*Math.sin(car.velAngle);
        car.speed -= slopeAlongDir * 250 * (getBiome(-car.y/10).slopeMul||1.0) * dt;
        if (car.speed < 0) car.speed = 0;
        car.vx = Math.cos(car.velAngle)*car.speed; car.vy = Math.sin(car.velAngle)*car.speed;
        car.x += car.vx*dt; car.y += car.vy*dt;
        postFinishDist += car.speed * dt; distance += car.speed * dt;

        // ── Tree collision during coasting ──
        cachedTrees = getTreeCells();
        const cc = {x:car.x, y:car.y, r:car.width*0.35};
        for (const t of cachedTrees) {
            const tdx=t.x-car.x, tdy=t.y-car.y;
            if (tdx*tdx+tdy*tdy > 600*600) continue;
            if (circleCircle(cc,t)) { treeCrashCoasting = true; gameOver('finish'); return; }
        }

        // Fade in finish banner
        if (finishBanner && finishBanner.fadeIn) {
            finishBanner.alpha = Math.min(1, (performance.now()-finishBanner.startTime)/500);
            if (finishBanner.alpha>=1) { finishBanner.fadeIn=false; finishBanner.holdStart=performance.now(); }
        }

        if (car.speed < 1 || postFinishDist > 5000) { gameOver('finish'); return; }
        cam.x = car.x; cam.y = car.y;
        const carH = getHeight(car.x, car.y);
        const speedRatio = car.speed / cm.baseSpeed;
        const centeringY = H*0.52 + speedRatio * (CAR_BASE_Y - H*0.52);
        carScreenY += (centeringY - carH * HEIGHT_SCALE - carScreenY) * Math.min(1, 2.5*dt);
        for (let i=particles.length-1;i>=0;i--) { particles[i].x+=particles[i].vx*dt; particles[i].y+=particles[i].vy*dt; particles[i].life-=dt; if (particles[i].life<=0) particles.splice(i,1); }
        if (shakeT>0) shakeT-=dt; shakeI*=0.88;
        document.getElementById('dist').textContent = Math.floor(distance/10);
        document.getElementById('speed-val').textContent = Math.round(car.speed*0.36);
        document.getElementById('fuel-txt').textContent = fuel.toFixed(1);
        document.getElementById('fuel-bar').style.width = (fuel/getUpgradeVal('tank')*100)+'%';
        document.getElementById('coins').textContent = totalCoins+runCoins;
        return;
    }
    const DRIFT_RESPONSE = 3.0;

    let turning = 0;
    if (keys['ArrowLeft']||keys['a']||keys['A']) turning = -1;
    if (keys['ArrowRight']||keys['d']||keys['D']) turning = 1;
    if (keys['touchLeft']) turning = -1;
    if (keys['touchRight']) turning = 1;

    const targetTurnRate = turning * cm.turnSpeed;
    const STEER_RESPONSE = 4.5;
    const steerBlend = Math.min(1, STEER_RESPONSE*dt);
    car.turnRate += (targetTurnRate - car.turnRate) * steerBlend;
    car.angle += car.turnRate * dt;

    if (Math.abs(car.turnRate) > 0.01 && car.speed > 30) {
        const turnRad = Math.abs(car.turnRate)*dt;
        const lossFactor = 0.15 * getUpgradeVal('hand');
        car.speed -= car.speed * lossFactor * turnRad;
    }

    ignitionTimer += dt;
    const IGNITION_DURATION = 1.5;
    const MAX_FUEL = getUpgradeVal('tank');
    const fuelRatio = MAX_FUEL > 0 ? fuel/MAX_FUEL : 0;

    let thrustFactor;
    if (ignitionTimer < 0.25) {
        thrustFactor = 0.02 + Math.sin(ignitionTimer*60)*0.02;
    } else if (ignitionTimer < IGNITION_DURATION) {
        const t = (ignitionTimer-0.25)/(IGNITION_DURATION-0.25);
        thrustFactor = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
        thrustFactor += Math.sin(ignitionTimer*30)*(1-t)*0.06;
    } else {
        thrustFactor = 1.0;
    }

    let decayFactor = 1.0;
    if (fuel>0 && fuelRatio<0.25) {
        decayFactor = fuelRatio/0.25;
        decayFactor += Math.sin(ignitionTimer*20)*(1-decayFactor)*0.5;
        decayFactor = Math.max(0,Math.min(1,decayFactor));
    }

    const thrust = cm.baseThrust * getUpgradeVal('eng') * thrustFactor * decayFactor;
    const MAX_SPEED = cm.baseSpeed;

    if (fuel > 0) {
        playRocket(thrustFactor*decayFactor);
        fuel -= dt; if (fuel<0) { fuel=0; stopRocket(); }
        car.speed += thrust*dt;
        if (car.speed > MAX_SPEED) car.speed = MAX_SPEED;
        const particleRate = (ignitionTimer<IGNITION_DURATION)?5:(fuelRatio<0.25)?4:2;
        if (car.speed>40 || ignitionTimer<IGNITION_DURATION || fuelRatio<0.25) {
            const bx = car.x - Math.cos(car.angle)*(car.height/2);
            const by = car.y - Math.sin(car.angle)*(car.height/2);
            for (let i=0;i<particleRate;i++) {
                const isSmoke = (ignitionTimer<1.2&&Math.random()<0.4)||(fuelRatio<0.25&&Math.random()<0.55);
                const ss = (fuelRatio<0.15)?1.6:1.0;
                particles.push({
                    x:bx+(Math.random()-.5)*(isSmoke?28*ss:16), y:by+(Math.random()-.5)*(isSmoke?28*ss:16),
                    vx:-Math.cos(car.angle)*(isSmoke?12:40+Math.random()*80)*ss+car.vx*.3,
                    vy:-Math.sin(car.angle)*(isSmoke?12:40+Math.random()*80)*ss+car.vy*.3,
                    life:(isSmoke?0.6:0.3)+Math.random()*(isSmoke?1.0:0.5),
                    r:(isSmoke?6:2)+Math.random()*(isSmoke?8:3), smoke:isSmoke,
                });
            }
        }
    } else {
        engineDryTimer += dt;
        if (engineDryTimer < 0.8) {
            const sputter = Math.sin(engineDryTimer*35)*0.35;
            car.speed += thrust*Math.max(0,sputter)*0.4*dt;
            car.speed -= cm.friction*0.5*dt;
            const bx = car.x - Math.cos(car.angle)*(car.height/2);
            const by = car.y - Math.sin(car.angle)*(car.height/2);
            for (let i=0;i<5;i++) {
                particles.push({
                    x:bx+(Math.random()-.5)*32, y:by+(Math.random()-.5)*32,
                    vx:-Math.cos(car.angle)*(10+Math.random()*25)+car.vx*.2,
                    vy:-Math.sin(car.angle)*(10+Math.random()*25)+car.vy*.2,
                    life:0.5+Math.random()*1.2, r:5+Math.random()*9, smoke:true,
                });
            }
        } else {
            car.speed -= cm.friction * dt;
        }
        if (car.speed < 0) car.speed = 0;
        playRocket(Math.max(0,(0.8-engineDryTimer)/0.8)*0.4);
        if (engineDryTimer>=0.8) stopRocket();
    }

    let angleDiff = car.angle - car.velAngle;
    while (angleDiff>Math.PI) angleDiff-=2*Math.PI;
    while (angleDiff<-Math.PI) angleDiff+=2*Math.PI;
    car.velAngle += angleDiff * Math.min(1, DRIFT_RESPONSE*dt);
    car.vx = Math.cos(car.velAngle)*car.speed;
    car.vy = Math.sin(car.velAngle)*car.speed;
    car.x += car.vx*dt; car.y += car.vy*dt;

    // ── Wake wave generation (water mode, fast boat) ──
    if (gameMode==='water' && car.speed > 30) {
        const wakeStr = (car.speed - 30) / 500;
        if (Math.random() < car.speed * dt * 0.08) {
            wakePoints.push({x:car.x, y:car.y, strength:wakeStr, age:0, angle:car.velAngle, trailDist:0});
        }
        for (let i=wakePoints.length-1; i>=0; i--) {
            wakePoints[i].age += dt;
            wakePoints[i].trailDist += car.speed * dt;
            wakePoints[i].strength -= dt * 0.15;
            if (wakePoints[i].strength <= 0 || wakePoints[i].age > 4) wakePoints.splice(i,1);
        }
    }

    const h0 = getHeight(car.x, car.y);
    const hx = getHeight(car.x+6, car.y);
    const hy = getHeight(car.x, car.y+6);
    const slopeX = (hx-h0)/6, slopeY = (hy-h0)/6;
    const slopeAlongDir = slopeX*Math.cos(car.velAngle) + slopeY*Math.sin(car.velAngle);
    const slopeMul = getBiome(-car.y/10).slopeMul || 1.0;
    car.speed -= slopeAlongDir * 250 * slopeMul * dt;
    if (car.speed < 0) car.speed = 0;

    if (car.y <= getFinishY()) {
        finishSpeedKmh = Math.round(car.speed*0.36);
        if (!coasting) {
            runStartTime = runStartTime || performance.now();
            const runSec = (performance.now() - runStartTime) / 1000;
            const finMeters = Math.floor(distance/10);
            const isRec = isNewRecord(finMeters);
            finishBanner = { alpha: 0, fadeIn: true, startTime: performance.now(), speedKmh: finishSpeedKmh, runTime: runSec, player: activeProfile||'Spieler', isRecord: isRec };
            addHighscore({ meters: finMeters, speedKmh: finishSpeedKmh, time: runSec, car: getCarModel().name, date: new Date().toISOString() });
        }
        coasting = true;
    }

    distance += car.speed*dt;
    const totalM = Math.floor(distance/10);
    const newCoins = Math.floor(totalM/5);
    if (newCoins>runCoins) { runCoins=newCoins; playCoin(); }

    cam.x = car.x; cam.y = car.y;

    const carH = getHeight(car.x, car.y);
    const speedRatio = car.speed / cm.baseSpeed;
    const centeringY = H*0.52 + speedRatio * (CAR_BASE_Y - H*0.52);
    carScreenY += (centeringY - carH * HEIGHT_SCALE - carScreenY) * Math.min(1, 2.5*dt);
    const cosA = Math.cos(car.angle), sinA = Math.sin(car.angle);
    const hFwd = getHeight(car.x+cosA*8, car.y+sinA*8);
    const hBwd = getHeight(car.x-cosA*8, car.y-sinA*8);
    carTilt = (hFwd-hBwd)*HEIGHT_SCALE/(16*SCALE_BASE);

    cachedTrees = getTreeCells();
    const cc = {x:car.x, y:car.y, r:car.width*0.35};
    const MAX_COL_DIST = 600;
    for (const t of cachedTrees) {
        const tdx=t.x-car.x, tdy=t.y-car.y;
        if (tdx*tdx+tdy*tdy > MAX_COL_DIST*MAX_COL_DIST) continue;
        if (circleCircle(cc,t)) {
            if (coasting) { treeCrashCoasting = true; gameOver('finish'); return; }
            else { gameOver('crash'); return; }
        }
    }

    // ── Spawn & collect fuel canisters ──
    if (!coasting && fuelCans.length < 10 && Math.random() < 0.015) {
        const ang = car.velAngle + (Math.random()-0.5)*1.4;
        const dist = 800 + Math.random()*1200;
        fuelCans.push({ x: car.x + Math.cos(ang)*dist, y: car.y + Math.sin(ang)*dist, r: 18 });
    }
    for (let i=fuelCans.length-1; i>=0; i--) {
        const fc = fuelCans[i];
        const dx = fc.x - car.x, dy = fc.y - car.y;
        if (dx*dx+dy*dy < (fc.r+25)*(fc.r+25)) {
            if (!coasting) {
                const maxF = getUpgradeVal('tank');
                fuel = Math.min(maxF, fuel + maxF*0.35);
                playCoin();
                for (let p=0;p<8;p++) {
                    particles.push({
                        x:fc.x, y:fc.y,
                        vx:(Math.random()-.5)*120, vy:(Math.random()-.5)*120,
                        life:0.6+Math.random()*0.4, color:'#ff0'
                    });
                }
            }
            fuelCans.splice(i,1);
        }
    }
    // ── Remove distant cans ──
    for (let i=fuelCans.length-1; i>=0; i--) {
        const dx=fuelCans[i].x-car.x, dy=fuelCans[i].y-car.y;
        if (dx*dx+dy*dy > 3000*3000) fuelCans.splice(i,1);
    }

    if (shakeT>0) shakeT-=dt;
    shakeI*=0.88;
    if (fuel>0&&ignitionTimer<1.5) { const rumble=(1.5-ignitionTimer)/1.5*6; shakeI=Math.max(shakeI,rumble); }

    for (let i=particles.length-1;i>=0;i--) { particles[i].x+=particles[i].vx*dt; particles[i].y+=particles[i].vy*dt; particles[i].life-=dt; if (particles[i].life<=0) particles.splice(i,1); }

    document.getElementById('level-label').textContent = 'L'+currentLevel;
    document.getElementById('dist').textContent = totalM;
    document.getElementById('fuel-txt').textContent = fuel.toFixed(1)+(fuel<=0?' ☠️':'');
    document.getElementById('fuel-bar').style.width = (fuel/MAX_FUEL*100)+'%';
    document.getElementById('coins').textContent = totalCoins+runCoins;
    document.getElementById('car-name').textContent = cm.name;
    document.getElementById('speed-val').textContent = Math.round(car.speed*0.36);
    document.getElementById('hud-name').textContent = activeProfile||'—';

    if (fuel<=0 && engineDryTimer>0.8 && car.speed<1.5) gameOver('fuel');
}

function gameOver(reason) {
    if (state==='over'||state==='levelComplete') return;
    stopRocket(); stopMusic();
    if (reason==='crash') playCrash(); else if (reason==='finish') playFinish();
    const meters = Math.floor(distance/10);
    totalCoins += runCoins;
    if (meters>bestDist) bestDist=meters;
    if (reason==='finish') {
        state='levelComplete'; shakeI= treeCrashCoasting ? 12 : 6; shakeT=.3;
        const speedBonus = finishSpeedKmh;
        const rollMeters = Math.floor(postFinishDist/10);
        const rollBonus = treeCrashCoasting ? 0 : Math.floor(rollMeters * 0.5);
        const levelReward = LEVELS[currentLevel]?LEVELS[currentLevel].reward:15;
        const penalty = treeCrashCoasting ? Math.floor((speedBonus+rollBonus+levelReward)*0.5) : 0;
        const totalBonus = levelReward + speedBonus + rollBonus - penalty;
        totalCoins += totalBonus;
        if (currentLevel<LEVELS.length-1) currentLevel++;
        document.getElementById('best').textContent=bestDist;
        document.getElementById('coins').textContent=totalCoins;
        persist();
        // Fade out banner over 2 seconds
        if (finishBanner) { finishBanner.fadeOut=true; finishBanner.fadeOutStart=performance.now(); }
        updateLastHighscoreRoll(rollMeters);
        showFinishOverlay(meters, totalBonus, finishSpeedKmh, rollMeters, speedBonus, rollBonus, levelReward);
    } else {
        state='over'; shakeI=reason==='crash'?18:10; shakeT=.5;
        document.getElementById('best').textContent=bestDist;
        document.getElementById('coins').textContent=totalCoins;
        persist(); showOverlay(reason,meters);
    }
}

// ── Rendering ──
function drawGround() {
    const biome = getBiome(-car.y/10);
    const skyGrad = ctx.createLinearGradient(0,0,0,HORIZON_Y+80);
    skyGrad.addColorStop(0,biome.skyTop); skyGrad.addColorStop(0.5,biome.skyBot); skyGrad.addColorStop(1,biome.skyBot);
    ctx.fillStyle=skyGrad; ctx.fillRect(0,0,W,HORIZON_Y+80);

    // Clouds
    const cloudCount = biome.treeType==='ruin' ? 6 : 3;
    for (let i=0;i<cloudCount;i++) {
        const cx=(Math.sin(i*2.1+car.y*0.0008)*W*0.4+W/2), cy=Math.cos(i*1.7+car.y*0.001)*20+HORIZON_Y*0.4;
        ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath();
        ctx.ellipse(cx,cy,35+Math.sin(i)*12,8+Math.cos(i*2)*3,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+18,cy-3,20,6,0,0,Math.PI*2); ctx.fill();
    }

    // Seabirds
    if (biome.treeType!=='none') {
        for (let i=0;i<3;i++) {
            const bx=Math.sin(i*2.7+car.y*0.0015+frame*0.02)*W*0.35+W/2, by=Math.cos(i*3.1+frame*0.025)*15+HORIZON_Y*0.55;
            ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(bx-4,by+1); ctx.quadraticCurveTo(bx,by-2,bx+4,by+1); ctx.stroke();
        }
    }

    const hazeGrad = ctx.createLinearGradient(0,HORIZON_Y-8,0,HORIZON_Y+40);
    hazeGrad.addColorStop(0,`rgba(${biome.fogR},${biome.fogG},${biome.fogB},0)`);
    hazeGrad.addColorStop(0.25,`rgba(${biome.groundLoR},${biome.groundLoG},${biome.groundLoB},0.35)`);
    hazeGrad.addColorStop(0.6,`rgba(${Math.floor((biome.groundLoR+biome.groundHiR)/2)},${Math.floor((biome.groundLoG+biome.groundHiG)/2)},${Math.floor((biome.groundLoB+biome.groundHiB)/2)},0.75)`);
    hazeGrad.addColorStop(1,`rgba(${biome.groundLoR},${biome.groundLoG},${biome.groundLoB},0.95)`);
    ctx.fillStyle=hazeGrad; ctx.fillRect(0,HORIZON_Y-8,W,48);

    const COLS=24, AHEAD_ROWS=35, BEHIND_ROWS=25;
    const MIN_Z=0.008, CAR_Z=1.0, MAX_Z=2.0;
    const cosA=Math.cos(car.angle), sinA=Math.sin(car.angle);
    const grid=[];

    const jitHash=(r,c)=>((r*127+c*311)%1000)/1000;

    for (let i=0; i<BEHIND_ROWS; i++) {
        const z = CAR_Z + (i/BEHIND_ROWS)*(MAX_Z-CAR_Z);
        const depth = (1/z-1)/PERSP;
        const baseSY = HORIZON_Y+(CAR_BASE_Y-HORIZON_Y)*z;
        const maxLatOff = (W/2+40)/Math.max(0.012,SCALE_BASE*z);
        const cellW = maxLatOff*2/COLS;
        const row=[];
        for (let col=0; col<=COLS; col++) {
            const jit = (col>0&&col<COLS) ? (jitHash(i,col)-0.5)*cellW*1.6 : 0;
            const latOff = (col/COLS-0.5)*maxLatOff*2 + jit;
            const wx=car.x+cosA*depth-sinA*latOff, wy=car.y+sinA*depth+cosA*latOff;
            const h=getHeight(wx,wy); const hDisp=h*z*HEIGHT_SCALE;
            row.push({sx:W/2+latOff*SCALE_BASE*z, sy:baseSY-hDisp, h, z, latOff, depth, wx, wy});
        }
        grid.push(row);
    }

    for (let i=0; i<=AHEAD_ROWS; i++) {
        const z = CAR_Z - (i/AHEAD_ROWS)*(CAR_Z-MIN_Z);
        const depth = (1/z-1)/PERSP;
        const baseSY = HORIZON_Y+(CAR_BASE_Y-HORIZON_Y)*z;
        const maxLatOff = (W/2+40)/Math.max(0.012,SCALE_BASE*z);
        const cellW = maxLatOff*2/COLS;
        const row=[];
        for (let col=0; col<=COLS; col++) {
            const jit = (col>0&&col<COLS) ? (jitHash(i+BEHIND_ROWS,col)-0.5)*cellW*1.6 : 0;
            const latOff = (col/COLS-0.5)*maxLatOff*2 + jit;
            const wx=car.x+cosA*depth-sinA*latOff, wy=car.y+sinA*depth+cosA*latOff;
            const h=getHeight(wx,wy); const hDisp=h*z*HEIGHT_SCALE;
            row.push({sx:W/2+latOff*SCALE_BASE*z, sy:baseSY-hDisp, h, z, latOff, depth, wx, wy});
        }
        grid.push(row);
    }

    const totalRows=grid.length;
    const LIGHT_X=-0.55, LIGHT_Y=-0.65, LIGHT_Z=0.52;
    for (let row=totalRows-2; row>=0; row--) {
        const r0=grid[row], r1=grid[row+1];
        for (let col=0; col<COLS; col++) {
            const p0=r0[col], p1=r0[col+1], p2=r1[col+1], p3=r1[col];
            const avgZ=(p0.z+p1.z+p2.z+p3.z)*0.25;
            if (avgZ<0.012) continue;
            const minX=Math.min(p0.sx,p1.sx,p2.sx,p3.sx), maxX=Math.max(p0.sx,p1.sx,p2.sx,p3.sx);
            if (maxX<-20||minX>W+20) continue;
            const avgH=(p0.h+p1.h+p2.h+p3.h)*0.25;
            const fogFactor=Math.max(0,Math.min(1,(avgZ-0.15)/0.7));
            const diagFlip = ((row*73+col*157)%100)<50;

            const isIsland = gameMode==='water' && avgH > 2;
            if (gameMode==='water') {
                if (isIsland) {
                    const hNorm=(avgH*biome.heightMul+45)/90;
                    const d=0.8;
                    const rc=Math.floor((120+hNorm*90)*d), gc=Math.floor((100+hNorm*90)*d), bc=Math.floor((50+hNorm*60)*d);
                    ctx.fillStyle=`rgb(${Math.floor(rc+(biome.fogR-rc)*fogFactor)},${Math.floor(gc+(biome.fogG-gc)*fogFactor)},${Math.floor(bc+(biome.fogB-bc)*fogFactor)})`;
                } else {
                    const waveShimmer = Math.sin(p0.wx*0.05 + p0.wy*0.05 + frame*0.04) * 10;
                    const depthFade = Math.min(1, avgZ*1.2);
                    const wShallow = biome.waterShallow || '#1a6a8a';
                    const wDeep = biome.waterDeep || '#0a3050';
                    const sr=parseInt(wShallow.slice(1,3),16), sg=parseInt(wShallow.slice(3,5),16), sb=parseInt(wShallow.slice(5,7),16);
                    const dr=parseInt(wDeep.slice(1,3),16), dg=parseInt(wDeep.slice(3,5),16), db=parseInt(wDeep.slice(5,7),16);
                    const wr=Math.floor(sr+(dr-sr)*depthFade+waveShimmer), wg=Math.floor(sg+(dg-sg)*depthFade+waveShimmer), wb=Math.floor(sb+(db-sb)*depthFade+waveShimmer);
                    ctx.fillStyle=`rgb(${Math.max(0,Math.min(255,wr))},${Math.max(0,Math.min(255,wg))},${Math.max(0,Math.min(255,wb))})`;
                }
            } else {
                // Land terrain — height-based coloring
                const hNorm = Math.max(-1, Math.min(1, avgH / 50));
                const gndR = biome.groundLoR + (biome.groundHiR - biome.groundLoR) * (hNorm * 0.5 + 0.5);
                const gndG = biome.groundLoG + (biome.groundHiG - biome.groundLoG) * (hNorm * 0.5 + 0.5);
                const gndB = biome.groundLoB + (biome.groundHiB - biome.groundLoB) * (hNorm * 0.5 + 0.5);
                const fr = Math.floor(gndR + (biome.fogR - gndR) * fogFactor);
                const fg = Math.floor(gndG + (biome.fogG - gndG) * fogFactor);
                const fb = Math.floor(gndB + (biome.fogB - gndB) * fogFactor);
                ctx.fillStyle = `rgb(${fr},${fg},${fb})`;
            }
            ctx.beginPath(); ctx.moveTo(p0.sx,p0.sy); ctx.lineTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.closePath();
            ctx.fill();
            if (!diagFlip) {
                ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.lineTo(p3.sx,p3.sy); ctx.closePath();
                ctx.fill();
            } else {
                ctx.beginPath(); ctx.moveTo(p0.sx,p0.sy); ctx.lineTo(p2.sx,p2.sy); ctx.lineTo(p3.sx,p3.sy); ctx.closePath();
                ctx.fill();
            }
        }
    }

    // Wave crest lines on near water (water mode only)
    if (gameMode==='water' && grid.length>BEHIND_ROWS+2) {
        for (let i=BEHIND_ROWS+2; i<Math.min(BEHIND_ROWS+12, grid.length); i++) {
            const r=grid[i]; if (!r) continue;
            const z=r[0].z;
            ctx.strokeStyle=`rgba(255,255,255,${0.04+Math.sin(frame*0.05+z*5)*0.02})`;
            ctx.lineWidth=0.8; ctx.beginPath();
            let started=false;
            for (let col=0; col<r.length; col++) {
                const p=r[col]; if (p.h>2) { started=false; continue; }
                const wy=p.sy+Math.sin(p.wx*0.08+p.wy*0.08+frame*0.06)*3*z;
                if (!started) { ctx.moveTo(p.sx,wy); started=true; }
                else ctx.lineTo(p.sx,wy);
            }
            ctx.stroke();
        }
    }
}

function drawTree(t) {
    const s = worldToScreen(t.x, t.y);
    if (s.rry > 320) return;
    const th = getHeight(t.x, t.y);
    s.y -= th * s.z * HEIGHT_SCALE;
    if (s.x<-100||s.x>W+100||s.y>H+100) return;
    const r = t.r * s.scale;
    if (r<0.08) return;
    const biome = getBiome(-t.y/10);
    const treeH = r*2.8*HEIGHT_SCALE*s.z;
    const topY = s.y - treeH;

    // ── PALM (default island tree) ──
    if (biome.treeType==='palm') {
        ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.1,s.y,r*0.5,r*0.18,0,0,Math.PI*2); ctx.fill();
        // Trunk (curved coconut palm)
        const tw=r*0.18; ctx.strokeStyle='#8b6b4a'; ctx.lineWidth=tw; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.quadraticCurveTo(s.x+r*0.2,topY+treeH*0.3,s.x+r*0.08,topY+treeH*0.1); ctx.stroke();
        ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=tw*0.5; ctx.stroke();
        // Fronds
        const fc=s.x+r*0.08, fcy=topY+treeH*0.1;
        for (let i=0;i<5;i++) {
            const ang=-Math.PI/2+(i-2)*0.55, len=r*0.7*(0.6+i*0.1);
            ctx.strokeStyle=`#${['3a8a2a','4a9a3a','2a7a1a','3a7a2a','4a8a3a'][i]}`; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(fc,fcy); ctx.quadraticCurveTo(fc+Math.cos(ang)*len*0.5,fcy+Math.sin(ang)*len*0.5-len*0.2,fc+Math.cos(ang)*len,fcy+Math.sin(ang)*len); ctx.stroke();
        }
        // Coconuts
        ctx.fillStyle='#6b3a1a'; ctx.beginPath(); ctx.arc(fc,fcy+2,r*0.08,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(fc+2,fcy+1,r*0.07,0,Math.PI*2); ctx.fill();
        return;
    }
    // ── REEF / CORAL ──
    if (biome.treeType==='reef') {
        const cx=s.x, cy=s.y-r*0.3;
        const colors=['#ff6b6b','#ff9f43','#feca57','#ff6b8a','#ff4757','#ff8a5c'];
        for (let i=0;i<5;i++) {
            const ang=(i/5)*Math.PI*2+0.3, len=r*0.5*(0.4+i*0.12);
            ctx.fillStyle=colors[i]; ctx.beginPath();
            ctx.moveTo(cx,cy); ctx.quadraticCurveTo(cx+Math.cos(ang-0.3)*len*0.6,cy-len*0.4,cx+Math.cos(ang)*len,cy-len*0.3); ctx.quadraticCurveTo(cx+Math.cos(ang+0.2)*len*0.5,cy-len*0.2,cx+Math.cos(ang+0.5)*len*0.3,cy); ctx.fill();
        }
        ctx.fillStyle='rgba(255,255,200,0.4)'; ctx.beginPath(); ctx.arc(cx,cy-r*0.1,r*0.3,0,Math.PI*2); ctx.fill();
        return;
    }
    // ── VOLCANO ──
    if (biome.treeType==='volcano') {
        const cx=s.x, topY2=s.y-treeH*0.9;
        ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.1,s.y,r*0.8,r*0.25,0,0,Math.PI*2); ctx.fill();
        // Mountain
        const grad=ctx.createLinearGradient(cx-r,topY2,cx+r,s.y);
        grad.addColorStop(0,'#4a3020'); grad.addColorStop(0.4,'#6b4030'); grad.addColorStop(1,'#3a6040');
        ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(cx-r*0.8,s.y); ctx.lineTo(cx-r*0.15,topY2+r*0.2); ctx.lineTo(cx+r*0.1,topY2); ctx.lineTo(cx+r*0.7,s.y); ctx.closePath(); ctx.fill();
        // Lava glow
        const lavaGrad=ctx.createRadialGradient(cx,topY2,r*0.05,cx,topY2,r*0.4);
        lavaGrad.addColorStop(0,'rgba(255,180,30,0.5)'); lavaGrad.addColorStop(1,'rgba(255,60,10,0)');
        ctx.fillStyle=lavaGrad; ctx.beginPath(); ctx.arc(cx,topY2,r*0.4,0,Math.PI*2); ctx.fill();
        // Smoke
        ctx.fillStyle='rgba(80,80,80,0.3)'; ctx.beginPath(); ctx.arc(cx+Math.sin(frame*0.03)*2,topY2-4,3,0,Math.PI*2); ctx.fill();
        return;
    }
    // ── ROCK (storm rocks) ──
    if (biome.treeType==='rock') {
        ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.1,s.y,r*0.7,r*0.22,0,0,Math.PI*2); ctx.fill();
        const rw=r*0.45, rh=treeH*0.55;
        ctx.fillStyle='#7a8a8a'; ctx.beginPath(); ctx.moveTo(s.x-rw,s.y); ctx.lineTo(s.x-rw*0.7,s.y-rh); ctx.lineTo(s.x+rw*0.5,s.y-rh*0.9); ctx.lineTo(s.x+rw,s.y-rh*0.25); ctx.lineTo(s.x+rw*0.5,s.y); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#5a6a6a'; ctx.beginPath(); ctx.moveTo(s.x-rw*0.2,s.y); ctx.lineTo(s.x-rw*0.1,s.y-rh*0.7); ctx.lineTo(s.x+rw*0.3,s.y-rh*0.55); ctx.lineTo(s.x+rw*0.2,s.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=0.6; ctx.stroke();
        return;
    }
    // ── RUIN (ancient temple) ──
    if (biome.treeType==='ruin') {
        const cx=s.x, topY2=s.y-treeH*0.6;
        ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.1,s.y,r*0.6,r*0.2,0,0,Math.PI*2); ctx.fill();
        // Columns
        for (let i=-1;i<=1;i+=2) {
            const colX=cx+i*r*0.22, colW=r*0.08;
            ctx.fillStyle='#c8c0b0'; ctx.fillRect(colX-colW,topY2+treeH*0.1,colW*2,treeH*0.45);
            ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(colX-colW*0.5,topY2+treeH*0.1,colW*0.8,treeH*0.45);
        }
        // Triangle pediment
        ctx.fillStyle='#b8b0a0'; ctx.beginPath(); ctx.moveTo(cx-r*0.45,topY2+treeH*0.15); ctx.lineTo(cx+r*0.45,topY2+treeH*0.15); ctx.lineTo(cx,topY2); ctx.closePath(); ctx.fill();
        // Glow
        ctx.fillStyle='rgba(180,220,255,0.25)'; ctx.beginPath(); ctx.arc(cx,topY2+treeH*0.25,r*0.25,0,Math.PI*2); ctx.fill();
        return;
    }
    if (biome.treeType==='none') return;
    // ── PINE (land forest) ──
    if (biome.treeType==='pine') {
        ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.05,s.y,r*0.45,r*0.15,0,0,Math.PI*2); ctx.fill();
        const tw=r*0.12; ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=tw; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x,topY); ctx.stroke();
        ctx.fillStyle='#2a6a1a'; ctx.beginPath(); ctx.moveTo(s.x-r*0.55,topY+treeH*0.6); ctx.lineTo(s.x,topY); ctx.lineTo(s.x+r*0.55,topY+treeH*0.6); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#3a8a2a'; ctx.beginPath(); ctx.moveTo(s.x-r*0.45,topY+treeH*0.35); ctx.lineTo(s.x,topY-treeH*0.1); ctx.lineTo(s.x+r*0.45,topY+treeH*0.35); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#4a9a3a'; ctx.beginPath(); ctx.moveTo(s.x-r*0.3,topY+treeH*0.1); ctx.lineTo(s.x,topY-treeH*0.15); ctx.lineTo(s.x+r*0.3,topY+treeH*0.1); ctx.closePath(); ctx.fill();
        return;
    }
    // ── CACTUS (desert) ──
    if (biome.treeType==='cactus') {
        ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.05,s.y,r*0.3,r*0.1,0,0,Math.PI*2); ctx.fill();
        const cw=r*0.14; ctx.fillStyle='#5a8a4a'; ctx.fillRect(s.x-cw,topY,cw*2,treeH);
        ctx.fillStyle='#4a7a3a'; ctx.fillRect(s.x-cw*0.4,topY,cw*0.7,treeH);
        // Arms
        ctx.fillStyle='#5a8a4a'; ctx.fillRect(s.x-cw,topY+treeH*0.3,cw*1.8,r*0.1); ctx.fillRect(s.x-cw,topY+treeH*0.3,r*0.1,treeH*0.25);
        ctx.fillRect(s.x+cw*0.3,topY+treeH*0.15,r*0.1,treeH*0.35);
        return;
    }
    // ── ICE (ice crystal) ──
    if (biome.treeType==='ice') {
        ctx.fillStyle='rgba(200,230,255,0.2)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.05,s.y,r*0.4,r*0.15,0,0,Math.PI*2); ctx.fill();
        const ig=ctx.createLinearGradient(s.x,topY,s.x,s.y);
        ig.addColorStop(0,'rgba(220,245,255,0.9)'); ig.addColorStop(0.5,'rgba(180,220,255,0.7)'); ig.addColorStop(1,'rgba(140,190,230,0.4)');
        ctx.fillStyle=ig; ctx.beginPath(); ctx.moveTo(s.x-r*0.4,s.y); ctx.lineTo(s.x-r*0.12,topY+treeH*0.35); ctx.lineTo(s.x+r*0.15,topY); ctx.lineTo(s.x+r*0.35,s.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8; ctx.stroke();
        return;
    }
    // ── CRYSTAL (rainbow space) ──
    if (biome.treeType==='crystal') {
        const hue=(s.x*0.3+car.y*0.05)%360;
        ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.05,s.y,r*0.3,r*0.1,0,0,Math.PI*2); ctx.fill();
        const cg=ctx.createLinearGradient(s.x,topY,s.x,s.y);
        cg.addColorStop(0,`hsla(${hue},80%,75%,0.9)`); cg.addColorStop(0.6,`hsla(${hue+20},70%,55%,0.7)`); cg.addColorStop(1,`hsla(${hue+40},60%,35%,0.4)`);
        ctx.fillStyle=cg; ctx.beginPath(); ctx.moveTo(s.x-r*0.35,s.y); ctx.lineTo(s.x-r*0.1,topY+treeH*0.3); ctx.lineTo(s.x+r*0.12,topY); ctx.lineTo(s.x+r*0.3,s.y); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(s.x,topY+treeH*0.3,r*0.12,0,Math.PI*2); ctx.fill();
        return;
    }
    // Default: sand dune
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s.x+r*0.1,s.y,r*0.7,r*0.22,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#dcc8a0'; ctx.beginPath(); ctx.ellipse(s.x,s.y-r*0.1,r*0.6,r*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c8b080'; ctx.beginPath(); ctx.ellipse(s.x-r*0.1,s.y-r*0.05,r*0.3,r*0.12,0,0,Math.PI*2); ctx.fill();
}

function drawCar() {
    const cx=W/2, cy=carScreenY;
    const carScale=SCALE_BASE;
    const cm = getCarModel();
    if (gameMode==='land') { drawLandCar(cx, cy, carScale, cm); return; }
    drawWaterBoat(cx, cy, carScale, cm);
}

function drawWaterBoat(cx, cy, carScale, cm) {
    const hullColor = cm.color;
    const hullDark = cm.darkColor;
    const deckColor = cm.deckColor;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(-carTilt);

    const w=car.width*carScale, h=car.height*carScale;
    const hullLen=w*0.9, hullBeam=h*0.55;
    const bowX=-hullLen/2, sternX=hullLen/2;
    const deckY=-hullBeam*0.2, keelY=hullBeam*0.7;
    const waterlineY=hullBeam*0.15;

    // ── Rocket exhaust (underwater + above) ──
    const igniting=ignitionTimer<1.5, showFlame=fuel>0&&(car.speed>40||igniting);
    if (showFlame) {
        const fs=igniting?(1.5+Math.random()*0.8):1.0;
        const fl=(18+Math.random()*18+car.speed*.07)*fs, fw=(6+Math.random()*4)*fs;
        const og=ctx.createLinearGradient(0,sternX,0,sternX+fl+10);
        og.addColorStop(0,'rgba(255,200,50,.9)'); og.addColorStop(.3,'rgba(255,80,10,.7)');
        og.addColorStop(.7,'rgba(255,20,0,.2)'); og.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle=og; ctx.beginPath();
        ctx.moveTo(-fw,sternX); ctx.quadraticCurveTo(-fw-5,sternX+fl*.5,0,sternX+fl);
        ctx.quadraticCurveTo(fw+5,sternX+fl*.5,fw,sternX); ctx.fill();
        const ig=ctx.createLinearGradient(0,sternX,0,sternX+fl*.4);
        ig.addColorStop(0,'rgba(255,255,220,1)'); ig.addColorStop(1,'rgba(255,150,20,0)');
        ctx.fillStyle=ig; ctx.beginPath(); ctx.moveTo(-fw*.35,sternX); ctx.quadraticCurveTo(0,sternX+fl*.3,fw*.35,sternX); ctx.fill();
    }

    // ── Water splash spray ──
    if (car.speed > 30) {
        for (let i=0;i<8;i++) {
            const sx=bowX+Math.random()*8, sy=waterlineY-Math.random()*6;
            ctx.fillStyle=`rgba(180,220,255,${0.3+Math.random()*0.3})`;
            ctx.beginPath(); ctx.arc(sx,sy,1+Math.random()*2,0,Math.PI*2); ctx.fill();
        }
    }

    // ── Shadow on water ──
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,waterlineY+3,w*0.45,hullBeam*0.25,0,0,Math.PI*2); ctx.fill();

    // ── Hull ──
    const hullGrad=ctx.createLinearGradient(0,deckY,0,keelY);
    hullGrad.addColorStop(0,deckColor); hullGrad.addColorStop(0.3,hullColor); hullGrad.addColorStop(1,hullDark);
    ctx.fillStyle=hullGrad;
    ctx.beginPath();
    ctx.moveTo(bowX-3,waterlineY); // bow
    ctx.quadraticCurveTo(bowX+12,deckY,bowX+hullLen*0.25,deckY); // deck near bow
    ctx.lineTo(sternX-hullLen*0.15,deckY); // straight deck
    ctx.quadraticCurveTo(sternX+2,deckY,sternX+8,waterlineY); // stern
    ctx.quadraticCurveTo(sternX-hullLen*0.15,keelY-2,bowX+hullLen*0.3,keelY); // keel curve
    ctx.quadraticCurveTo(bowX+5,waterlineY,bowX-3,waterlineY); // bow back
    ctx.fill();
    
    // Hull planks
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=0.8;
    for (let i=1;i<=3;i++) {
        const y=deckY+(keelY-deckY)*(i/4);
        ctx.beginPath(); ctx.moveTo(bowX+hullLen*0.1,y); ctx.lineTo(sternX-hullLen*0.1,y); ctx.stroke();
    }

    // ── Deck railing ──
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(bowX+hullLen*0.2,deckY-1); ctx.lineTo(sternX-hullLen*0.2,deckY-1); ctx.stroke();

    // ── Bowsprit ──
    ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bowX+4,deckY-2); ctx.lineTo(bowX-10,deckY-8); ctx.stroke();

    // ── Mast ──
    const mastX=bowX+hullLen*0.35, mastH=hullBeam*1.3;
    const mastBase=deckY-2, mastTop=mastBase-mastH;
    // Main mast
    ctx.fillStyle='#6b4a2a'; ctx.fillRect(mastX-2,mastTop,4,mastH);
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(mastX-1,mastTop,1.5,mastH);
    // Crow's nest
    ctx.fillStyle='#5a3520'; ctx.fillRect(mastX-4,mastTop+mastH*0.4,8,4);

    // ── Pirate Flag 🏴‍☠️ ──
    const flagX=mastX+2, flagTop=mastTop+4, flagW=hullLen*0.22, flagH=flagW*0.65;
    // Flag waving animation
    ctx.fillStyle='#111';
    ctx.beginPath();
    ctx.moveTo(flagX,flagTop);
    ctx.quadraticCurveTo(flagX+flagW*0.3,flagTop-2+Math.sin(frame*0.08)*3,flagX+flagW*0.6,flagTop+Math.sin(frame*0.1)*2);
    ctx.quadraticCurveTo(flagX+flagW*0.8,flagTop+flagH*0.4+Math.sin(frame*0.09)*2,flagX+flagW,flagTop+flagH*0.5+Math.sin(frame*0.07)*3);
    ctx.quadraticCurveTo(flagX+flagW*0.7,flagTop+flagH+Math.sin(frame*0.11)*2,flagX+flagW*0.3,flagTop+flagH+Math.sin(frame*0.08)*3);
    ctx.quadraticCurveTo(flagX+flagW*0.1,flagTop+flagH*0.7,flagX,flagTop+flagH);
    ctx.closePath(); ctx.fill();
    // Skull (simplified at small scale)
    if (flagW>8) {
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(flagX+flagW*0.42,flagTop+flagH*0.38,flagH*0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(flagX+flagW*0.58,flagTop+flagH*0.38,flagH*0.2,0,Math.PI*2); ctx.fill();
        // Crossbones
        ctx.strokeStyle='#fff'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(flagX+flagW*0.35,flagTop+flagH*0.55); ctx.lineTo(flagX+flagW*0.65,flagTop+flagH*0.75); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(flagX+flagW*0.65,flagTop+flagH*0.55); ctx.lineTo(flagX+flagW*0.35,flagTop+flagH*0.75); ctx.stroke();
    }

    // ── Ship's Wheel ⚓ (at stern) ──
    const wheelX=sternX-hullLen*0.1, wheelY=deckY-hullBeam*0.55, wheelR=Math.max(6,hullBeam*0.35);
    // Wheel spokes
    ctx.strokeStyle='#8b6b4a'; ctx.lineWidth=1.8;
    for (let i=0;i<8;i++) {
        const ang=i*Math.PI/4+frame*0.01;
        ctx.beginPath();
        ctx.moveTo(wheelX+Math.cos(ang)*wheelR*0.25,wheelY+Math.sin(ang)*wheelR*0.25);
        ctx.lineTo(wheelX+Math.cos(ang)*wheelR,wheelY+Math.sin(ang)*wheelR);
        ctx.stroke();
    }
    // Wheel rim
    ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(wheelX,wheelY,wheelR,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#8b6b4a'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(wheelX,wheelY,wheelR*0.7,0,Math.PI*2); ctx.stroke();
    // Hub
    ctx.fillStyle='#5a3520'; ctx.beginPath(); ctx.arc(wheelX,wheelY,wheelR*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c8a060'; ctx.beginPath(); ctx.arc(wheelX,wheelY,wheelR*0.08,0,Math.PI*2); ctx.fill();

    // ── Cannons/Exhaust ports ──
    const engLvl = carUpgrades[activeCar] ? carUpgrades[activeCar].eng : 0;
    const numNozzles = 2 + engLvl;
    const nozzleSpread = Math.min(hullLen*0.5, numNozzles*10);
    for (let n=0;n<numNozzles;n++) {
        const nx = -nozzleSpread/2 + n*(nozzleSpread/(numNozzles-1||1));
        const ny=sternX-4;
        ctx.fillStyle='#333'; ctx.fillRect(nx-3,ny-2,6,8);
        ctx.fillStyle='#111'; ctx.fillRect(nx-2,ny-1,4,6);
    }

    // ── Lantern at bow ──
    ctx.fillStyle='#ffcc40'; ctx.beginPath(); ctx.arc(bowX+2,deckY-4,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,200,50,0.4)'; ctx.beginPath(); ctx.arc(bowX+2,deckY-4,6,0,Math.PI*2); ctx.fill();

    ctx.restore();
}

function drawLandCar(cx, cy, carScale, cm) {
    const carColor = cm.color, carDark = cm.darkColor, accent = cm.deckColor;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-carTilt);
    const w = car.width * carScale, h = car.height * carScale;
    // Rocket exhaust
    const igniting = ignitionTimer < 1.5, showFlame = fuel > 0 && (car.speed > 40 || igniting);
    if (showFlame) {
        const fs = igniting ? (1.5 + Math.random() * 0.8) : 1.0;
        const fl = (16 + Math.random() * 18 + car.speed * 0.07) * fs, fw = (5 + Math.random() * 3) * fs;
        const og = ctx.createLinearGradient(0, h/2, 0, h/2 + fl + 10);
        og.addColorStop(0, 'rgba(255,200,50,.9)'); og.addColorStop(.3, 'rgba(255,80,10,.7)');
        og.addColorStop(.7, 'rgba(255,20,0,.2)'); og.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = og; ctx.beginPath();
        ctx.moveTo(-fw, h/2); ctx.quadraticCurveTo(-fw - 5, h/2 + fl * .5, 0, h/2 + fl);
        ctx.quadraticCurveTo(fw + 5, h/2 + fl * .5, fw, h/2); ctx.fill();
        const ig = ctx.createLinearGradient(0, h/2, 0, h/2 + fl * .4);
        ig.addColorStop(0, 'rgba(255,255,220,1)'); ig.addColorStop(1, 'rgba(255,150,20,0)');
        ctx.fillStyle = ig; ctx.beginPath(); ctx.moveTo(-fw * .35, h/2); ctx.quadraticCurveTo(0, h/2 + fl * .3, fw * .35, h/2); ctx.fill();
    }
    // Wheels
    const wheelR = w * 0.18, wheelY = h * 0.3;
    for (let side = -1; side <= 1; side += 2) {
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(side * w * 0.32, wheelY, wheelR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(side * w * 0.32, wheelY, wheelR * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(side * w * 0.32, wheelY, wheelR * 0.25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(side * w * 0.32, -wheelY, wheelR * 0.9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(side * w * 0.32, -wheelY, wheelR * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    // Body
    const bodyGrad = ctx.createLinearGradient(0, -h * 0.35, 0, h * 0.25);
    bodyGrad.addColorStop(0, accent); bodyGrad.addColorStop(0.4, carColor); bodyGrad.addColorStop(1, carDark);
    ctx.fillStyle = bodyGrad; ctx.beginPath();
    ctx.moveTo(-w * 0.4, -h * 0.25); ctx.quadraticCurveTo(-w * 0.48, -h * 0.05, -w * 0.48, h * 0.1);
    ctx.lineTo(w * 0.35, h * 0.1); ctx.quadraticCurveTo(w * 0.48, h * 0.05, w * 0.45, -h * 0.05);
    ctx.quadraticCurveTo(w * 0.3, -h * 0.35, w * 0.05, -h * 0.4);
    ctx.quadraticCurveTo(-w * 0.15, -h * 0.38, -w * 0.4, -h * 0.25); ctx.fill();
    // Windows
    ctx.fillStyle = 'rgba(150,220,255,0.6)'; ctx.beginPath();
    ctx.moveTo(w * 0.05, -h * 0.32); ctx.lineTo(w * 0.25, -h * 0.28); ctx.lineTo(w * 0.28, -h * 0.05); ctx.lineTo(w * 0.02, -h * 0.08); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    // Spoiler
    ctx.fillStyle = carDark; ctx.fillRect(-w * 0.3, -h * 0.38, w * 0.32, h * 0.06);
    ctx.fillStyle = carColor; ctx.fillRect(-w * 0.3, -h * 0.32, w * 0.32, h * 0.03);
    // Nozzles
    const engLvl = carUpgrades[activeCar] ? carUpgrades[activeCar].eng : 0;
    const numN = 1 + engLvl;
    for (let n = 0; n < numN; n++) {
        const nx = -4 + n * (8 / (numN || 1));
        ctx.fillStyle = '#333'; ctx.fillRect(nx - 3, h * 0.08, 6, 6);
        ctx.fillStyle = '#111'; ctx.fillRect(nx - 2, h * 0.09, 4, 4);
    }
    ctx.restore();
}

function drawParticles() {
    for (const p of particles) {
        const s=worldToScreen(p.x,p.y);
        const a=Math.min(p.life/0.5,1); const pr=p.r*s.scale*a;
        if (pr<0.3) continue;
        // Mode-dependent smoke color: water spray or dust
        const smokeColor = gameMode==='water' ? `rgba(180,210,240,${a*0.5})` : `rgba(180,160,140,${a*0.4})`;
        ctx.fillStyle=p.smoke?smokeColor:`rgba(255,${140+Math.floor(a*90)},20,${a*.65})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,pr,0,Math.PI*2); ctx.fill();
    }
}

function drawFinishLine() {
    const fy = getFinishY();
    const lp = worldToScreen(-80, fy), rp = worldToScreen(80, fy);
    const s = worldToScreen(0, fy);
    if (s.y < HORIZON_Y-30 || s.y > H+60) return;
    const scale = s.scale;
    const postW = Math.max(2.5, 5*scale);
    const postH = Math.max(22, 65*scale);
    const finialR = postW*1.6;

    // ── Glow behind banner ──
    const bannerTop = s.y - postH*0.75;
    const bannerH = Math.max(7, 18*scale);
    const glowGrad = ctx.createLinearGradient(0, bannerTop-bannerH, 0, bannerTop+bannerH*2);
    glowGrad.addColorStop(0, 'rgba(255,255,200,0)');
    glowGrad.addColorStop(0.5, 'rgba(255,255,200,0.35)');
    glowGrad.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(lp.x-10, bannerTop-bannerH, rp.x-lp.x+20, bannerH*3);

    // ── Posts ──
    for (const p of [lp, rp]) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(p.x-postW*0.3, s.y-postH+3, postW, postH);
        // Pole gradient
        const pg = ctx.createLinearGradient(p.x-postW, 0, p.x+postW, 0);
        pg.addColorStop(0, '#777'); pg.addColorStop(0.4, '#ddd'); pg.addColorStop(0.6, '#eee'); pg.addColorStop(1, '#555');
        ctx.fillStyle = pg;
        ctx.fillRect(p.x-postW/2, s.y-postH, postW, postH);
        // Finial
        ctx.fillStyle = '#ff0';
        ctx.beginPath(); ctx.arc(p.x, s.y-postH, finialR, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#c80'; ctx.lineWidth = 1;
        ctx.stroke();
    }

    // ── Checkered banner ──
    const bw = rp.x - lp.x + postW;
    const cellW = Math.max(6, 14*scale);
    const cells = Math.max(1, Math.floor(bw / cellW));
    const cellW2 = bw / cells;
    for (let i = 0; i < cells; i++) {
        ctx.fillStyle = i%2===0 ? '#fff' : '#111';
        ctx.fillRect(lp.x-postW/2 + i*cellW2, bannerTop, cellW2, bannerH);
    }

    if (scale > 0.3) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.font = `bold ${Math.max(12, 22*scale)}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText('🏁 ZIEL', s.x, bannerTop-4);
    }
}

function drawFuelCans() {
    const canAlpha = coasting ? 0.2 : 1.0;
    for (const fc of fuelCans) {
        const s = worldToScreen(fc.x, fc.y);
        if (s.x<-40||s.x>W+40||s.y<HORIZON_Y-20||s.y>H+40) continue;
        const r = Math.max(6, 16*s.scale);
        // Glow
        const glow = ctx.createRadialGradient(s.x, s.y, r*0.3, s.x, s.y, r*2);
        glow.addColorStop(0, `rgba(255,200,30,${0.6*canAlpha})`);
        glow.addColorStop(0.5, `rgba(255,140,20,${0.2*canAlpha})`);
        glow.addColorStop(1, `rgba(255,80,0,0)`);
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(s.x, s.y, r*2, 0, Math.PI*2); ctx.fill();
        // Can body
        ctx.globalAlpha = canAlpha;
        ctx.fillStyle = '#e8a020';
        ctx.beginPath(); ctx.arc(s.x, s.y-r*0.15, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f5c840';
        ctx.fillRect(s.x-r*0.7, s.y-r*0.9, r*1.4, r*1.4);
        // ⛽ symbol
        ctx.fillStyle = '#333';
        ctx.font = `bold ${Math.max(8,r*0.9)}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText('⛽', s.x, s.y+r*0.3);
        ctx.globalAlpha = 1.0;
    }
}

function drawNavArrow() {
    const el = document.getElementById('nav-arrow');
    if (!el) return;
    if (car.y <= getFinishY()+100) { el.style.display='none'; return; }
    const dx=0-car.x, dy=getFinishY()-car.y;
    const angleToGoal=Math.atan2(dy,dx);
    let diffAngle=angleToGoal-car.angle;
    const relAngle=Math.atan2(Math.sin(diffAngle),Math.cos(diffAngle));
    const deg = Math.round(relAngle*180/Math.PI);
    const distToGoal = Math.floor((car.y - getFinishY()) / 10);
    el.style.display='block';
    el.innerHTML = `<span style="display:inline-block;transform:rotate(${deg}deg);font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))">⬆</span><br><span style="font-size:11px;color:#fff;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:5px">${Math.abs(distToGoal)}m</span>`;
}

function drawMarker() {
    const s=worldToScreen(0,0);
    if (s.x>-50&&s.x<W+50&&s.y>HORIZON_Y&&s.y<H+50) {
        const sz=Math.max(14,22*s.scale); ctx.font=`bold ${sz}px system-ui`; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.textAlign='center'; ctx.fillText('🏁',s.x,s.y);
    }
}

function drawFinishBanner() {
    if (!finishBanner) return;
    let a = finishBanner.alpha;
    if (finishBanner.fadeOut) {
        a = Math.max(0, 1 - (performance.now()-finishBanner.fadeOutStart)/2000);
        if (a<=0) { finishBanner=null; return; }
    }
    const t = performance.now();
    const cy = H*0.22 + Math.sin(t*0.001)*6; // parallax drift
    ctx.save(); ctx.globalAlpha = a;
    // Glow
    const glow = ctx.createRadialGradient(W/2, cy, 0, W/2, cy, 120);
    glow.addColorStop(0, 'rgba(255,220,50,0.35)'); glow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(W/2, cy, 120, 0, Math.PI*2); ctx.fill();
    // Title
    ctx.textAlign='center';
    ctx.font='bold 20px system-ui'; ctx.fillStyle='#fff';
    ctx.fillText('🏴‍☠️ ZÜNDSEQUENZ', W/2, H/2-60);
    ctx.fillText('🏁 ZIEL ERREICHT!', W/2, cy-25);
    ctx.shadowBlur=0;
    // Info line
    ctx.font='18px system-ui'; ctx.fillStyle='#ff0';
    ctx.fillText(`⚡ ${finishBanner.speedKmh} km/h  ⏱ ${finishBanner.runTime.toFixed(1)}s  👤 ${finishBanner.player}`, W/2, cy+5);
    if (finishBanner.isRecord) {
        ctx.font='bold 22px system-ui'; ctx.fillStyle='#ff6600';
        const pulse = 1+Math.sin(t*0.008)*0.15;
        ctx.save(); ctx.translate(W/2, cy+32); ctx.scale(pulse,pulse);
        ctx.fillText('🏆 NEUER REKORD! 🏆', 0, 0);
        ctx.restore();
    }
    ctx.restore();
}

function render() {
    ctx.clearRect(0,0,W,H);
    let sx=0,sy=0; if (shakeT>0||shakeI>1) { sx=(Math.random()-.5)*shakeI; sy=(Math.random()-.5)*shakeI; }
    ctx.save(); ctx.translate(sx,sy);
    drawGround();
    const activeTrees=cachedTrees||getTreeCells();
    activeTrees.sort((a,b)=>{
        const da=-(a.x*Math.cos(car.angle)+a.y*Math.sin(car.angle)-(car.x*Math.cos(car.angle)+car.y*Math.sin(car.angle)));
        const db=-(b.x*Math.cos(car.angle)+b.y*Math.sin(car.angle)-(car.x*Math.cos(car.angle)+car.y*Math.sin(car.angle)));
        return da-db;
    });
    for (const t of activeTrees) drawTree(t);
    drawMarker(); drawFuelCans(); drawCar(); drawParticles();
    drawFinishBanner();
    ctx.restore();
    drawFinishLine();
    if (car.y>getFinishY()+100) drawNavArrow();

    if (state==='waiting') {
        ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';ctx.textAlign='center';
        const py = activeProfile ? `👤 ${activeProfile}` : '👤 Kein Profil';
        ctx.font='11px system-ui'; ctx.fillStyle='#aaa'; ctx.fillText(py, W/2, H/2-110);
        if (!audioOn) { ctx.fillStyle='#fff'; ctx.fillText('🔇 Tippe für Ton',W/2,H/2+110); }
        const lvlInfo=LEVELS[currentLevel];
        const lvlName=lvlInfo?lvlInfo.name:`Level ${currentLevel}`;
        const lvlTarget=lvlInfo?lvlInfo.target:350;
        const cm=getCarModel();
        const modeTitle = gameMode==='land' ? '🚀 RAKETENAUTO 🚀' : '🏴‍☠️ RAKETENBOOT 🏴‍☠️';
        const controlHint = gameMode==='land' ? '⬆ Gas  |  SPACE Zündung  |  ⬅ ➡ lenken' : '⬆ Gas  |  SPACE Zündung  |  ⬅ ➡ lenken';
        ctx.fillStyle='#fff';
        ctx.font='bold 34px system-ui';ctx.fillText(modeTitle,W/2,H/2-75);
        ctx.font='18px system-ui';ctx.fillText(`${cm.name} — ${cm.desc}`,W/2,H/2-45);
        ctx.font='20px system-ui';ctx.fillText(lvlName,W/2,H/2-20);
        ctx.font='16px system-ui';ctx.fillText(`Ziel: ${lvlTarget}m`,W/2,H/2+8);
        ctx.font='18px system-ui';ctx.fillText('STARTE die Zündsequenz',W/2,H/2+40);
        ctx.font='13px system-ui';ctx.fillText(controlHint,W/2,H/2+65);
        const steerLabel = gameMode==='land' ? '🛞 Lenkung' : '⚓ Steuer';
        ctx.font='12px system-ui';ctx.fillText(`⛽ Tank: ${getUpgradeVal('tank')}s | 🔥 Motor: ${Math.round(getUpgradeVal('eng')*100)}% | ${steerLabel}: ${Math.round(getUpgradeVal('hand')*100)}% Verlust`,W/2,H/2+85);
        ctx.textAlign='start';
    }
    if (state==='ignition') {
        const cm = getCarModel();
        const valvePct = Math.round(gasValve*100);
        // Valve bar
        const barW=260, barH=18, barX=(W-barW)/2, barY=H/2+30;
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,H/2-80,W,170);
        ctx.textAlign='center';
        ctx.font='bold 20px system-ui'; ctx.fillStyle='#fff';
        ctx.fillText('🚀 ZÜNDSEQUENZ', W/2, H/2-60);
        ctx.font='14px system-ui'; ctx.fillStyle='#ccc';
        ctx.fillText(`${cm.name} — L${currentLevel}`, W/2, H/2-38);
        // Valve gauge background
        ctx.fillStyle='#333'; ctx.fillRect(barX, barY, barW, barH);
        const grad=ctx.createLinearGradient(barX,0,barX+barW,0);
        grad.addColorStop(0,'#4a4'); grad.addColorStop(0.5,'#fa0'); grad.addColorStop(1,'#f40');
        ctx.fillStyle=grad; ctx.fillRect(barX, barY, barW*gasValve, barH);
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(barX, barY, barW, barH);
        ctx.fillStyle='#fff'; ctx.font='bold 12px system-ui'; ctx.fillText(`Gasventil: ${valvePct}%`, W/2, barY-8);
        // Hints
        if (gasValve < 0.15) {
            ctx.font='16px system-ui'; ctx.fillStyle='#fff';
            ctx.fillText(isMobile ? '🔥 Halte BILDSCHIRM-MITTE für Gas' : '⬆ Halte HOCH um das Gasventil zu öffnen', W/2, barY+45);
            ctx.font='11px system-ui'; ctx.fillStyle='#888';
            ctx.fillText('⬅ ➡  zum Lenken', W/2, barY+65);
        } else if (!ignitionTriggered) {
            ctx.font='bold 18px system-ui'; ctx.fillStyle='#fa0';
            ctx.fillText(isMobile ? '🔥 ZÜNDUNG LÄUFT... 🔥' : '🔥 DRÜCKE SPACE FÜR ZÜNDUNG! 🔥', W/2, barY+45);
            ctx.font='11px system-ui'; ctx.fillStyle='#888';
            ctx.fillText(isMobile ? '◀ ▶  zum Lenken' : '⬅ ➡  zum Lenken', W/2, barY+65);
        } else if (gasValve < 1.0) {
            ctx.font='16px system-ui'; ctx.fillStyle='#ff0';
            ctx.fillText(isMobile ? '🔥 HALTE MITTE FÜR VOLLGAS!' : '⬆ GAS BIS MAXIMUM!', W/2, barY+45);
            ctx.font='11px system-ui'; ctx.fillStyle='#888';
            ctx.fillText(isMobile ? '◀ ▶  lenken | gleich geht\'s los!' : '⬅ ➡  lenken | gleich geht\'s los!', W/2, barY+65);
        }
        ctx.textAlign='start';
    }
}

function showShop() {
    const cm = getCarModel();
    const tankLvl = carUpgrades[activeCar].tank;
    const engLvl = carUpgrades[activeCar].eng;
    const handLvl = carUpgrades[activeCar].hand;

    function carCard(key) {
        const c = CAR_MODELS[key];
        const owned = carUpgrades[key] && true;
        if (!owned) {
            return `<div class="shop-card">
                <div class="name">${c.name}</div>
                <div class="desc">${c.desc}</div>
                <div class="cost">Speed: ${c.baseSpeed} | Tank max ${c.tankLvl[c.tankLvl.length-1]}s</div>
                <button class="btn-buy" ${totalCoins>=c.cost?'':'disabled'} onclick="buyCar('${key}')">Kaufen: 🪙${c.cost}</button>
            </div>`;
        }
        const active = key===activeCar?' ✅':'';
        return `<div class="shop-card" style="${key===activeCar?'border-color:#fa0;border-width:2px':''}">
            <div class="name">${c.name}${active}</div>
            <div class="desc">⛽L${carUpgrades[key].tank} 🔥L${carUpgrades[key].eng} ⚓L${carUpgrades[key].hand}</div>
            <button class="btn-start" style="font-size:12px;padding:5px 12px" onclick="switchCar('${key}')">${key===activeCar?'Aktiv':'Wählen'}</button>
        </div>`;
    }

    function upgBtn(upgType, lvl, maxLvl, costs, levelArr, suffix) {
        if (lvl >= maxLvl-1) return `<button class="btn-buy owned" disabled>MAX — ${levelArr[lvl]}${suffix}</button>`;
        const cost = costs[lvl+1];
        const can = totalCoins >= cost;
        return `<button class="btn-buy" ${can?'':'disabled'} onclick="buyUpgrade('${upgType}')">
            🪙${cost} → ${levelArr[lvl+1]}${suffix}</button>`;
    }

    const upgradesLocked = currentLevel < 3;
    overlay.innerHTML = `
        <h2>🛒 Shop — 🪙 ${totalCoins}</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:600px;margin-bottom:8px">
            ${CAR_KEYS.map(k=>carCard(k)).join('')}
        </div>
        ${upgradesLocked
            ? `<div style="font-size:14px;color:#999;margin:10px 0;padding:8px 16px;background:rgba(255,170,0,.08);border-radius:8px;border:1px dashed rgba(255,170,0,.25)">🔒 Upgrades ab L3 verfügbar — noch ${3-currentLevel} Level fahren!</div>`

            <div class="shop-card">
                <div class="lvl">Stufe ${tankLvl}/${cm.tankLvl.length-1}</div>
                <div class="name">⛽ Tank</div>
                <div class="desc">Aktuell: ${cm.tankLvl[tankLvl]}s</div>
                ${upgBtn('tank',tankLvl,cm.tankLvl.length,cm.tankCost,cm.tankLvl,'s')}
            </div>
            <div class="shop-card">
                <div class="lvl">Stufe ${engLvl}/${cm.engLvl.length-1}</div>
                <div class="name">🔥 Motor</div>
                <div class="desc">Mehr Düsen & Schub: ${Math.round(cm.engLvl[engLvl]*100)}%</div>
                ${upgBtn('eng',engLvl,cm.engLvl.length,cm.engCost,cm.engLvl.map(v=>Math.round(v*100)),'%')}
            </div>

        </div>`}
        <button class="btn-start" onclick="startGame()" style="margin-top:14px">🔁 Weiter!</button>

function buyCar(key) {
    const c = CAR_MODELS[key];
    if (totalCoins < c.cost) return;
    if (carUpgrades[key]) return;
    totalCoins -= c.cost;
    carUpgrades[key] = {tank:0, eng:0, hand:0};
    activeCar = key;
    document.getElementById('coins').textContent = totalCoins;
    document.getElementById('car-name').textContent = c.name;
    persist();
    showShop();
}

function switchCar(key) {
    activeCar = key;
    document.getElementById('car-name').textContent = CAR_MODELS[key].name;
    persist();
    showShop();
}

function buyUpgrade(type) {
    const cm = getCarModel();
    const lvl = carUpgrades[activeCar][type];
    const costs = type==='tank'?cm.tankCost : type==='eng'?cm.engCost : cm.handCost;
    const maxLvl = costs.length-1;
    if (lvl >= maxLvl) return;
    if (totalCoins < costs[lvl+1]) return;
    totalCoins -= costs[lvl+1];
    carUpgrades[activeCar][type]++;
    document.getElementById('coins').textContent = totalCoins;
    persist();
    showShop();
}

function createProfile() {
    const inp = document.getElementById('new-profile-name');
    const name = inp.value.trim();
    if (!name) return;
    if (profiles[name]) { alert('Profil existiert bereits!'); return; }
    profiles[name] = { save: { totalCoins: 0, bestDist: 0, currentLevel: 1, activeCar: 'sprinter', carUpgrades: {} }, highscores: [] };
    const starterSave = profiles[name].save;
    for (const k of CAR_KEYS) { if (!starterSave.carUpgrades[k]) starterSave.carUpgrades[k] = {tank:0,eng:0,hand:0}; }
    saveProfiles(profiles);
    setActiveProfile(name);
    activeProfile = name;
    totalCoins = starterSave.totalCoins; bestDist = starterSave.bestDist; currentLevel = starterSave.currentLevel; activeCar = starterSave.activeCar; carUpgrades = starterSave.carUpgrades;
    document.getElementById('profile-overlay').style.display = 'none';
    document.getElementById('pause-overlay').style.display = 'none';
    updateHUD();
    render();
}
function selectProfile(name) {
    setActiveProfile(name);
    activeProfile = name;
    const s = profiles[name].save;
    totalCoins = s.totalCoins||0; bestDist = s.bestDist||0; currentLevel = s.currentLevel||1; activeCar = s.activeCar||'sprinter'; carUpgrades = s.carUpgrades||{};
    for (const k of CAR_KEYS) { if (!carUpgrades[k]) carUpgrades[k] = {tank:0,eng:0,hand:0}; }
    document.getElementById('profile-overlay').style.display = 'none';
    document.getElementById('pause-overlay').style.display = 'none';
    updateHUD();
    render();
}
function deleteProfile(name) {
    if (!confirm(`Profil "${name}" wirklich löschen?`)) return;
    delete profiles[name];
    saveProfiles(profiles);
    if (activeProfile===name) { activeProfile=null; localStorage.removeItem(ACTIVE_KEY); }
    showProfileDialog();
}

function hsSortBtn(col, label) {
    const active = hsSort===col;
    return `<button onclick="hsSort='${col}';showHighscores()"
        style="background:${active?'rgba(255,170,0,.25)':'rgba(255,255,255,.06)'};border:1px solid ${active?'#fa0':'rgba(255,255,255,.12)'};color:${active?'#fa0':'#aaa'};border-radius:6px;padding:3px 8px;margin:1px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s">${label}</button>`;
}

function renderHsRows(entries, showPlayer) {
    if (entries.length===0) return '<div class="stat" style="text-align:center">Noch keine Einträge</div>';
    let sorted = [...entries];
    if (hsSort==='meters') sorted.sort((a,b)=>b.meters-a.meters);
    else if (hsSort==='speed') sorted.sort((a,b)=>b.speedKmh-a.speedKmh);
    else if (hsSort==='time') sorted.sort((a,b)=>a.time-b.time);
    else if (hsSort==='roll') sorted.sort((a,b)=>(b.rollM||0)-(a.rollM||0));
    return sorted.map((e,i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;margin:2px 0;background:rgba(255,255,255,${i===0?'.12':'.05'});border-radius:6px;font-size:13px">

            <span style="flex:1;font-weight:600">${e.meters}m</span>
            <span style="opacity:.7;margin:0 6px;font-size:11px">⚡${e.speedKmh||'?'}km/h</span>
            <span style="opacity:.7;margin:0 6px;font-size:11px">⏱${(e.time||0).toFixed(1)}s</span>
            <span style="opacity:.6;margin:0 6px;font-size:10px">📏${e.rollM||0}m</span>
            ${showPlayer?`<span style="opacity:.6;font-size:10px;margin:0 4px">👤${e.player||'?'}</span>`:''}
            <span style="opacity:.4;font-size:10px">${e.car||''}</span>
        </div>
    `).join('');
}

function startGame() {
    if (!activeProfile) { showProfileDialog(); return; }
    initAudio();
    initGame();
    state = 'ignition';
    gasValve = 0; ignitionTriggered = false;
    overlay.style.display = 'none';
    document.getElementById('profile-overlay').style.display = 'none';
    document.getElementById('pause-overlay').style.display = 'none';
    document.getElementById('coins').textContent = totalCoins;
    document.getElementById('best').textContent = bestDist;
    document.getElementById('level-label').textContent = 'L'+currentLevel;
    document.getElementById('car-name').textContent = getCarModel().name;
    document.getElementById('hud-name').textContent = activeProfile||'—';
    lastTime = performance.now();
}

function toggleMenu() {
    if (!activeProfile) { showProfileDialog(); return; }
    if (state==='playing' || state==='ignition') {
        pauseGame();
    } else if (state==='paused') {
        resumeGame();
    } else {
        showProfileDialog();
    }
}

function pauseGame() {
    if (state==='ignition') { state='paused'; return; }
    state='paused';
    stopRocket();
    startChillPad();
    document.getElementById('pause-player-name').textContent = '👤 '+activeProfile;
    document.getElementById('pause-overlay').style.display='flex';
}

function resumeGame() {
    if (state!=='paused') return;
    state = (ignitionTriggered && gasValve < 1.0) ? 'ignition' : 'playing';
    stopChillPad();
    document.getElementById('pause-overlay').style.display='none';
    lastTime = performance.now();
}

function loop(now) {
    const dt = Math.min((now-lastTime)/1000, .1);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

updateHUD();
initGame();
render();

// Always show profile dialog on reload
showProfileDialog();

requestAnimationFrame(loop);

// ── Touch Controls (mobile) ──
let touchGas = false, touchLeft = false, touchRight = false;

function updateTouchFromTouches(touches) {
  touchLeft = false; touchRight = false; touchGas = false;
  const rect = canvas.getBoundingClientRect();
  for (const t of touches) {
    const rx = (t.clientX - rect.left) / rect.width;
    const ry = (t.clientY - rect.top) / rect.height;
    // Bottom half = steering zones, upper half also steers
    if (rx < 0.3) touchLeft = true;
    else if (rx > 0.7) touchRight = true;
    else touchGas = true; // Center zone = gas
  }
  keys['touchLeft'] = touchLeft;
  keys['touchRight'] = touchRight;
  // Update visual indicators
  if (zoneLeft) zoneLeft.classList.toggle('pressed', touchLeft);
  if (zoneRight) zoneRight.classList.toggle('pressed', touchRight);
  if (zoneGas) zoneGas.classList.toggle('pressed', touchGas);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state==='waiting') { if (!activeProfile) showProfileDialog(); else startGame(); }
  if (state==='over') { if (!activeProfile) showProfileDialog(); else startGame(); }
  updateTouchFromTouches(e.touches);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  updateTouchFromTouches(e.touches);
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  updateTouchFromTouches(e.touches);
});
canvas.addEventListener('touchcancel', e => {
  updateTouchFromTouches(e.touches);
});

</script>
