<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>🏴‍☠️ Raketenboot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 50px rgba(0,180,220,.4)}
canvas{display:block}
#hud{position:absolute;top:0;left:55px;right:55px;pointer-events:none;z-index:10;display:flex;justify-content:center;padding:8px 8px;gap:5px;flex-wrap:nowrap}
#ignite-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fa0;font-weight:900;text-align:center;pointer-events:none;z-index:12;letter-spacing:1px;text-shadow:0 0 20px rgba(255,170,0,.5)}
.hud-item{background:rgba(0,0,0,.82);color:#fff;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(6px);white-space:nowrap;display:flex;align-items:center;gap:3px}
#fuel-wrap{width:60px;height:5px;background:#333;border-radius:3px;overflow:hidden;margin-top:2px}
#fuel-bar{height:100%;background:linear-gradient(90deg,#f40,#fa0);border-radius:3px;transition:width .15s}
#overlay{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.85);flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:10px;backdrop-filter:blur(4px)}
#overlay h2{font-size:32px;color:#f40;margin-bottom:4px}
#overlay .stat{font-size:16px;opacity:.9}
#overlay button{margin:6px 4px;padding:10px 24px;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;letter-spacing:.5px;transition:transform .1s,box-shadow .1s}
#overlay button:hover{transform:scale(1.04)}
#overlay button:active{transform:scale(.96)}
.btn-start{background:#f40;color:#fff}
.btn-shop{background:#fa0;color:#111}
.btn-buy{background:#4a4;color:#fff;font-size:13px;padding:6px 14px}
.btn-buy:disabled{background:#555;color:#888;cursor:not-allowed}
.btn-buy.owned{background:#48a;color:#fff}
.shop-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:600px}
.shop-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:14px;width:170px;text-align:center}
.shop-card .lvl{font-size:12px;color:#fa0;margin-bottom:4px}
.shop-card .name{font-size:15px;font-weight:700;margin-bottom:2px}
.shop-card .desc{font-size:11px;opacity:.7;margin-bottom:6px}
.shop-card .cost{font-size:13px;color:#ff0;margin-bottom:6px}
#nav-arrow{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:15;text-align:center}
/* ── Touch Controls (mobile) ── */
#touch-zones{display:none;position:absolute;bottom:0;left:0;right:0;height:100%;pointer-events:none;z-index:16}
.touch-zone{position:absolute;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,0.25);transition:background 0.15s,border-color 0.15s}
.touch-zone.pressed{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.4)}
#zone-left{bottom:30px;left:15px;width:70px;height:70px}
#zone-right{bottom:30px;right:15px;width:70px;height:70px}
#zone-gas{bottom:90px;left:50%;transform:translateX(-50%);width:80px;height:80px;background:rgba(0,180,220,0.1);border-color:rgba(0,180,220,0.25);font-size:32px;color:rgba(0,200,240,0.35)}
#zone-gas.pressed{background:rgba(0,120,200,0.3);border-color:rgba(0,200,255,0.6)}
@media (hover:none) and (pointer:coarse){
  #touch-zones{display:block}
  #ignite-hint{bottom:200px;font-size:14px}
}
@media (max-width:500px){
  #wrap{width:100vw!important;height:100vh!important;border-radius:0}
  #menu-btn{top:10px;left:10px;padding:6px 12px}
  #music-btn{top:10px;right:10px}
}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="nav-arrow"></div>
<div id="touch-zones">
  <div class="touch-zone" id="zone-left">◀</div>
  <div class="touch-zone" id="zone-right">▶</div>
  <div class="touch-zone" id="zone-gas">💨</div>
</div>
<button id="menu-btn" onclick="toggleMenu()" title="Menü/Pause" style="position:absolute;top:6px;left:6px;z-index:18;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:18px;color:#fff;line-height:1">☰</button>
<button id="mode-btn" onclick="switchGameMode()" title="Land/Wasser wechseln" style="position:absolute;top:6px;left:44px;z-index:18;background:rgba(40,120,200,.25);border:1px solid rgba(100,180,255,.3);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:13px;color:#fff;line-height:1;font-weight:600">⛵ Wasser</button>
<button id="music-btn" onclick="toggleMusic()" title="Musik an/aus" style="position:absolute;top:6px;right:6px;z-index:18;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 7px;cursor:pointer;font-size:15px;color:#fff;line-height:1">🔊</button>
<div id="hud">
    <div class="hud-item">👤<span id="hud-name">—</span></div>
    <div class="hud-item"><span id="car-icon">⛵</span><span id="car-name">Schaluppe</span></div>
    <div class="hud-item">L<span id="level-label">1</span></div>
    <div class="hud-item">📏<span id="dist">0</span>m</div>
    <div class="hud-item">⚡<span id="speed-val">0</span></div>
    <div class="hud-item">⛽<span id="fuel-txt">5.0</span><div id="fuel-wrap"><div id="fuel-bar" style="width:100%"></div></div></div>
    <div class="hud-item">🪙<span id="coins">0</span></div>
    <div class="hud-item">🏆<span id="best">0</span></div>
</div>
<div id="overlay"></div>
<div id="pause-overlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:22;background:rgba(0,0,0,.78);flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:12px;backdrop-filter:blur(6px)">
    <h2 style="font-size:28px;color:#fa0">⏸ Pausiert</h2>
    <div class="stat" id="pause-player-name" style="font-size:15px;opacity:.8">👤 —</div>
    <button onclick="resumeGame()" style="background:#4a4;color:#fff;border:none;padding:12px 36px;border-radius:10px;font-weight:700;cursor:pointer;font-size:17px">▶ Fortsetzen</button>
    <button onclick="showProfileDialog();document.getElementById('pause-overlay').style.display='none'" style="background:#555;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px">👤 Profil wechseln</button>
</div>
<div id="profile-overlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:25;background:rgba(0,0,0,.88);flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:12px;backdrop-filter:blur(6px)">
    <div style="font-size:64px;margin-bottom:2px">🚀</div>
    <h2 id="profile-title" style="font-size:26px;color:#fa0;margin-bottom:2px">🏴‍☠️ Kapitän, wer bist du?</h2>
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:4px">
        <input id="new-profile-name" type="text" maxlength="14" style="padding:10px 14px;font-size:18px;font-weight:700;border-radius:8px;border:2px solid rgba(255,170,0,.4);background:rgba(255,255,255,.08);color:#fff;width:190px;text-align:center;letter-spacing:1px">
        <button onclick="randomizeName()" title="Zufallsname" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 14px;border-radius:8px;cursor:pointer;font-size:18px">🎲</button>
    </div>
    <button onclick="createProfile()" style="background:#fa0;color:#111;border:none;padding:12px 40px;border-radius:10px;font-weight:800;cursor:pointer;font-size:17px;letter-spacing:.5px;margin-top:4px">🚀 Los geht's!</button>
    <div id="profile-list-section" style="display:none;margin-top:14px;width:100%;max-width:340px">
        <div style="font-size:12px;opacity:.5;margin-bottom:6px">— oder Profil wählen —</div>
        <div id="profile-list" style="max-height:200px;overflow-y:auto;width:100%;padding:0 10px;"></div>
    </div>
</div>
</div>

<script>
// ──────────────────────────────────────
//  RAKETENBOOT 🏴‍☠️ 4 Schiffe, Wasserwelt mit Inseln
// ──────────────────────────────────────

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = Math.min(500, window.innerWidth);
let H = window.innerHeight;
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
// Touch zone refs
const zoneLeft = document.getElementById('zone-left');
const zoneRight = document.getElementById('zone-right');
const zoneGas = document.getElementById('zone-gas');

function resizeCanvas() {
  W = Math.min(500, window.innerWidth);
  H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  document.getElementById('wrap').style.width = W+'px';
  document.getElementById('wrap').style.height = H+'px';
  HORIZON_Y = H * 0.14;
  CAR_BASE_Y = H * 0.78;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

if (!ctx.roundRect) {
    ctx.roundRect = function(x,y,w,h,r) {
        if (typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
        this.beginPath();
        this.moveTo(x+r.tl,y);this.lineTo(x+w-r.tr,y);
        this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
        this.lineTo(x+w,y+h-r.br);this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
        this.lineTo(x+r.bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
        this.lineTo(x,y+r.tl);this.quadraticCurveTo(x,y,x+r.tl,y);
        this.closePath();
    };
}
canvas.width = W; canvas.height = H;
document.getElementById('wrap').style.width = W+'px';
document.getElementById('wrap').style.height = H+'px';

// ── Firebase (globale Bestenliste) ──
// ═══════════════════════════════════════════════════════════
// ANLEITUNG: Siehe unten "FIREBASE SETUP" oder lies README
// ═══════════════════════════════════════════════════════════
const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJEKT.firebaseapp.com",
    projectId: "DEIN_PROJEKT",
    storageBucket: "DEIN_PROJEKT.appspot.com",
    messagingSenderId: "DEINE_SENDER_ID",
    appId: "DEINE_APP_ID"
};
let db = null, fbReady = false, fbUid = null;
(function initFirebase(){
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebase.auth().signInAnonymously()
            .then(() => { fbUid = firebase.auth().currentUser.uid; fbReady = true; })
            .catch(e => { console.warn('Firebase Auth fehlgeschlagen:', e.message); });
    } catch(e) { console.warn('Firebase nicht verfügbar — globale Bestenliste offline:', e.message); }
})();

// ── Persistent Save ──
// ── Profiles & Highscores ──
const PROF_KEY = 'rocketcar_profiles_v1';
const ACTIVE_KEY = 'rocketcar_active_v1';

function randomName() {
    const a=['Donner','Blitz','Sturm','Feuer','Eis','Turbo','Raketen','Stahl','Düsen','Nitro','Vulkan','Cosmo','Shadow','Thunder','Hyper','Ultra','Mega','Psycho','Atomic','Dark'];
    const b=['Kralle','Faust','Wolf','Drache','Adler','Pilot','Raser','Falke','Krieger','Meister','Geist','Komet','Blitz','Stier','Hai','Bär','Viper','Phoenix','Titan','Wolf'];
    const r=()=>Math.floor(Math.random()*a.length);
    return a[r()]+' '+b[r()];
}
function randomizeName() {
    document.getElementById('new-profile-name').value=randomName();
}

function loadProfiles() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(PROF_KEY)) || {}; } catch {}
    // Migrate from old single-save system
    if (Object.keys(p).length===0) {
        try {
            const old = JSON.parse(localStorage.getItem('rocketcar_v3'));
            if (old) {
                p['Spieler'] = { save: old, highscores: [] };
                localStorage.setItem(ACTIVE_KEY, 'Spieler');
            }
        } catch {}
    }
    return p;
}
function saveProfiles(data) { localStorage.setItem(PROF_KEY, JSON.stringify(data)); }
function getActiveProfile() { return localStorage.getItem(ACTIVE_KEY) || null; }
function setActiveProfile(name) { localStorage.setItem(ACTIVE_KEY, name); }

let profiles = loadProfiles();
let activeProfile = getActiveProfile();

function getSave() {
    if (activeProfile && profiles[activeProfile]) return profiles[activeProfile].save;
    return {};
}
function putSave(s) {
    if (!activeProfile) return;
    if (!profiles[activeProfile]) profiles[activeProfile] = { save: s, highscores: [] };
    else profiles[activeProfile].save = s;
    saveProfiles(profiles);
}
function getHighscores() {
    if (activeProfile && profiles[activeProfile]) return profiles[activeProfile].highscores || [];
    return [];
}
function addHighscore(entry) {
    if (!activeProfile) return;
    if (!profiles[activeProfile]) profiles[activeProfile] = { save: getSave(), highscores: [] };
    if (!profiles[activeProfile].highscores) profiles[activeProfile].highscores = [];
    profiles[activeProfile].highscores.push(entry);
    profiles[activeProfile].highscores.sort((a,b) => b.meters - a.meters);
    if (profiles[activeProfile].highscores.length > 20) profiles[activeProfile].highscores.length = 20;
    saveProfiles(profiles);
    // Firestore: globale Bestenliste (fire-and-forget)
    if (fbReady && db) {
        db.collection('highscores').add({
            player: activeProfile,
            meters: entry.meters,
            speedKmh: entry.speedKmh,
            time: entry.time,
            rollM: entry.rollM || 0,
            car: entry.car || '',
            date: entry.date || new Date().toISOString(),
            uid: fbUid
        }).catch(e => console.warn('Firestore write failed:', e.message));
    }
}
function updateLastHighscoreRoll(rollM) {
    if (!activeProfile || !profiles[activeProfile]) return;
    const hs = profiles[activeProfile].highscores;
    if (hs.length > 0) { hs[hs.length-1].rollM = rollM; saveProfiles(profiles); }
}
function getGlobalHighscoresLocal() {
    const all = [];
    for (const [name, data] of Object.entries(profiles)) {
        for (const e of (data.highscores||[])) {
            all.push({...e, player: name});
        }
    }
    return all;
}
async function getGlobalHighscores() {
    if (!fbReady || !db) return getGlobalHighscoresLocal();
    try {
        const snap = await db.collection('highscores')
            .orderBy('meters', 'desc')
            .limit(50)
            .get();
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
        console.warn('Firestore read failed, fallback local:', e.message);
        return getGlobalHighscoresLocal();
    }
}
// Admin: Lösche Highscore-Eintrag (nur von Admin aus Firebase Console verwendbar)
async function deleteGlobalHighscore(id) {
    if (!fbReady || !db) return;
    try { await db.collection('highscores').doc(id).delete(); }
    catch(e) { console.warn('Delete failed:', e.message); }
}
function isNewRecord(meters) {
    const hs = getHighscores();
    if (hs.length === 0) return true;
    return meters > hs[0].meters;
}

// ── Car Models ──
const LAND_VEHICLES = {
    sprinter: { name:'🏎️ Sprinter', desc:'Wendig & ausgewogen', cost:0, baseSpeed:750, baseThrust:520, turnSpeed:3.5, friction:28, tankLvl:[5,7,9,12], tankCost:[0,25,60,130], engLvl:[1.0,1.25,1.5,1.8], engCost:[0,35,90,180], handLvl:[1.0,0.75,0.5,0.25], handCost:[0,18,48,110], color:'#e04040', darkColor:'#801010', deckColor:'#ff6666', },
    dragster: { name:'🚀 Dragster', desc:'Hohe Geschwindigkeit, träge Kurven', cost:80, baseSpeed:880, baseThrust:650, turnSpeed:2.5, friction:22, tankLvl:[4,6,8,10], tankCost:[0,36,84,165], engLvl:[1.0,1.3,1.7,2.2], engCost:[0,54,126,240], handLvl:[1.0,0.85,0.7,0.55], handCost:[0,30,72,150], color:'#4488cc', darkColor:'#1a3366', deckColor:'#66bbff', },
    monster: { name:'🛞 Monster Truck', desc:'Riesentank, beste Wendigkeit', cost:150, baseSpeed:620, baseThrust:400, turnSpeed:4.5, friction:35, tankLvl:[8,11,14,18], tankCost:[0,45,105,195], engLvl:[1.0,1.2,1.4,1.6], engCost:[0,30,75,150], handLvl:[1.0,0.6,0.35,0.15], handCost:[0,15,36,84], color:'#3a6b3a', darkColor:'#1e3b1e', deckColor:'#6bcf6b', },
    thrust: { name:'⚡ Raketencoupé', desc:'Extremer Schub, kurzer Burn', cost:300, baseSpeed:950, baseThrust:800, turnSpeed:2.8, friction:20, tankLvl:[3,4.5,6,8], tankCost:[0,54,120,240], engLvl:[1.0,1.4,1.9,2.6], engCost:[0,75,165,330], handLvl:[1.0,0.8,0.6,0.4], handCost:[0,42,96,195], color:'#553388', darkColor:'#2a1544', deckColor:'#b8a0c8', },
};
const WATER_VEHICLES = {
    sprinter: { name:'⛵ Schaluppe', desc:'Wendig & ausgewogen', cost:0, baseSpeed:750, baseThrust:520, turnSpeed:3.5, friction:28, tankLvl:[5,7,9,12], tankCost:[0,25,60,130], engLvl:[1.0,1.25,1.5,1.8], engCost:[0,35,90,180], handLvl:[1.0,0.75,0.5,0.25], handCost:[0,18,48,110], color:'#c89460', darkColor:'#8b5e3c', deckColor:'#deb887', },
    dragster: { name:'🚀 Schnellsegler', desc:'Hohe Geschwindigkeit, träge Kurven', cost:80, baseSpeed:880, baseThrust:650, turnSpeed:2.5, friction:22, tankLvl:[4,6,8,10], tankCost:[0,36,84,165], engLvl:[1.0,1.3,1.7,2.2], engCost:[0,54,126,240], handLvl:[1.0,0.85,0.7,0.55], handCost:[0,30,72,150], color:'#b84040', darkColor:'#6b2020', deckColor:'#d4a574', },
    monster: { name:'🛡️ Galeone', desc:'Riesentank, beste Wendigkeit', cost:150, baseSpeed:620, baseThrust:400, turnSpeed:4.5, friction:35, tankLvl:[8,11,14,18], tankCost:[0,45,105,195], engLvl:[1.0,1.2,1.4,1.6], engCost:[0,30,75,150], handLvl:[1.0,0.6,0.35,0.15], handCost:[0,15,36,84], color:'#3a6b3a', darkColor:'#1e3b1e', deckColor:'#c4a882', },
    thrust: { name:'⚡ Teufelsbrigantine', desc:'Extremer Schub, kurzer Burn', cost:300, baseSpeed:950, baseThrust:800, turnSpeed:2.8, friction:20, tankLvl:[3,4.5,6,8], tankCost:[0,54,120,240], engLvl:[1.0,1.4,1.9,2.6], engCost:[0,75,165,330], handLvl:[1.0,0.8,0.6,0.4], handCost:[0,42,96,195], color:'#553388', darkColor:'#2a1544', deckColor:'#b8a0c8', },
};
let gameMode = 'water'; // 'land' | 'water'
let CAR_MODELS = gameMode==='land' ? LAND_VEHICLES : WATER_VEHICLES;
const CAR_KEYS = ['sprinter','dragster','monster','thrust'];

let starterSave = getSave();
let totalCoins = starterSave.totalCoins || 0;
let bestDist   = starterSave.bestDist   || 0;
let currentLevel = starterSave.currentLevel || 1;
let activeCar    = starterSave.activeCar    || 'sprinter';
let carUpgrades  = starterSave.carUpgrades  || {};
for (const k of CAR_KEYS) {
    if (!carUpgrades[k]) carUpgrades[k] = {tank:0, eng:0, hand:0};
}

function getCarModel() { return CAR_MODELS[activeCar]; }

function getUpgradeVal(type) {
    const cm = getCarModel();
    const lvl = carUpgrades[activeCar][type];
    if (type==='tank') return cm.tankLvl[Math.min(lvl,cm.tankLvl.length-1)];
    if (type==='eng')  return cm.engLvl[Math.min(lvl,cm.engLvl.length-1)];
    return cm.handLvl[Math.min(lvl,cm.handLvl.length-1)];
}

function treeDensity(distMeters) {
    return Math.min(0.0015 + distMeters * 0.00004, 0.06);
}

// ── Game State ──
let state = 'waiting';
let car, particles, fuel, distance, runCoins, shakeT, shakeI, fuelCans, coasting, finishSpeedKmh, postFinishDist, treeCrashCoasting;
let ignitionTimer = 0, engineDryTimer = 0, gasValve = 0, ignitionTriggered = false;
let keys = {}, frame = 0, lastTime = performance.now();
let cachedTrees = null;
let runStartTime = 0;
let finishBanner = null; // {alpha, startTime, speedKmh, runTime, player, isRecord}

// ── Audio Engine ──
let audioCtx = null, audioOn = false;
let masterGain = null;
const sfx = {};

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);
    audioOn = true;
}

// Shared noise buffer for rocket & drums
let _noiseBuf = null;
function _getNoiseBuf() {
    if (_noiseBuf) return _noiseBuf;
    _noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const d = _noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return _noiseBuf;
}

// ── Rocket Engine (loud & aggressive crackling) ──
function playRocket(vol) {
    if (!audioOn||!audioCtx) return;
    if (!sfx.rocket) {
        // Main roar: filtered noise + low oscillator = aggressive rumble
        const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
        const d=buf.getChannelData(0);
        for (let i=0;i<d.length;i++) {
            const t=i/audioCtx.sampleRate;
            // Thick noise foundation + modulated low-end oscillator for "knatter"
            d[i]=(Math.random()*2-1)*0.3*Math.exp(-t*0.5)+Math.sin(t*55+Math.sin(t*31)*4)*0.12
               +Math.sin(t*110+Math.sin(t*17)*5)*0.06;
        }
        const bs=audioCtx.createBufferSource(); bs.buffer=buf; bs.loop=true; bs.loopStart=0.02; bs.loopEnd=1.5;

        // Aggressive resonant lowpass for that metallic crackle
        const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500; lp.Q.value=8;

        // Waveshaper for distortion — gives it that raw rocket bite
        const dist=audioCtx.createWaveShaper();
        const curve=new Float32Array(256);
        for (let i=0;i<256;i++) {
            const x=(i-128)/128;
            curve[i]=Math.tanh(x*2.5)*0.85+Math.sin(x*Math.PI*2)*0.08;
        }
        dist.curve=curve;

        const gain=audioCtx.createGain(); gain.gain.value=0;
        bs.connect(lp); lp.connect(dist); dist.connect(gain); gain.connect(masterGain);

        // Second layer: high-frequency crackle
        const cbuf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.3,audioCtx.sampleRate);
        const cd=cbuf.getChannelData(0);
        for (let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*0.4*Math.exp(-(i/audioCtx.sampleRate)*6);
        const csrc=audioCtx.createBufferSource(); csrc.buffer=cbuf; csrc.loop=true; csrc.loopStart=0.01; csrc.loopEnd=0.25;
        const chp=audioCtx.createBiquadFilter(); chp.type='highpass'; chp.frequency.value=2500;
        const cgain=audioCtx.createGain(); cgain.gain.value=0;
        csrc.connect(chp); chp.connect(cgain); cgain.connect(masterGain);

        sfx.rocket={src:bs,filter:lp,gain,crackle:csrc,cgain};
        bs.start(); csrc.start();
    }
    // Volume: much louder — rocket should ROAR
    sfx.rocket.gain.gain.value = Math.min(0.55, vol*0.65);
    sfx.rocket.filter.frequency.value = 120 + vol*800;
    sfx.rocket.filter.Q.value = 5 + vol*8;
    // Crackle layer — more crackle at low thrust (spitting), less at full (smooth roar)
    sfx.rocket.cgain.gain.value = vol<0.5 ? (1-vol)*0.3 : (1-vol)*0.12;
}
function stopRocket() {
    if (sfx.rocket) { sfx.rocket.gain.gain.value=0; sfx.rocket.cgain.gain.value=0; }
}

function _note(freq, dur, vol, type, dest) {
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type=type||'square'; osc.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.connect(g); g.connect(dest||masterGain);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
}

let musicNode = null, musicGain = null, musicEnabled = true;

const MUSIC_BPM = 165;

const RIFF_ROOT = [82.41,65.41,73.42,61.74, 82.41,65.41,73.42,61.74];

const LEAD_PAT = [
    0,0,0,0, 329.63,0,392,0, 440,0,523.25,0, 587.33,0,659.25,0,

function _makeMetalDistortion() {
    const dist=audioCtx.createWaveShaper();
    const curve=new Float32Array(256);
    for (let i=0;i<256;i++) {
        const x=(i-128)/128;

function startMusic() {
    if (!audioOn||!audioCtx||musicNode||!musicEnabled) return;
    musicGain = audioCtx.createGain(); musicGain.gain.value = 0.3;
    musicGain.connect(masterGain);

    // Guitar chain: distortion → EQ → gain
    const guitarDist = _makeMetalDistortion();
    const guitarEQ = audioCtx.createBiquadFilter(); guitarEQ.type='peaking'; guitarEQ.frequency.value=2200; guitarEQ.Q.value=1.5; guitarEQ.gain.value=8;
    const guitarGain = audioCtx.createGain(); guitarGain.gain.value = 0.25;
    guitarDist.connect(guitarEQ); guitarEQ.connect(guitarGain); guitarGain.connect(musicGain);

    const bassGain = audioCtx.createGain(); bassGain.gain.value = 0.22; bassGain.connect(musicGain);
    const kickGain = audioCtx.createGain(); kickGain.gain.value = 0.28; kickGain.connect(musicGain);
    const leadGain = audioCtx.createGain(); leadGain.gain.value = 0.15; leadGain.connect(musicGain);

    let stepIdx = 0, nextTime = audioCtx.currentTime + 0.05;
    musicNode = { playing: true };

    function sched() {
        if (!musicNode||!musicNode.playing||!audioOn) return;
        const t = audioCtx.currentTime;
        while (nextTime < t + 0.5) {
            const patIdx = stepIdx % (RIFF_ROOT.length*2);
            const halfLen = RIFF_ROOT.length;

            // ── Rhythm guitar: power chords (root + 5th) with chug ──
            const rootFreq = RIFF_ROOT[patIdx % halfLen];
            const chugVol = CHUG_PAT[patIdx % CHUG_PAT.length];
            if (rootFreq>0 && chugVol>0.1) {
                // Power chord: root + fifth
                [rootFreq, rootFreq*1.5, rootFreq*0.5].forEach((f,i) => {
                    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
                    osc.type='sawtooth'; osc.frequency.value=f;
                    const dur=MUSIC_STEP*(chugVol<0.5?0.5:1.2);
                    g.gain.setValueAtTime((i===0?0.22:0.12)*chugVol, nextTime);
                    g.gain.exponentialRampToValueAtTime(0.001, nextTime+dur);
                    osc.connect(g); g.connect(guitarDist);
                    osc.start(nextTime); osc.stop(nextTime+dur);
                });
            }

            // ── Bass: clean triangle, follows root ──
            if (rootFreq>0 && chugVol>0.3) {
                const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
                osc.type='triangle'; osc.frequency.value=rootFreq*0.5;
                const dur=MUSIC_STEP*1.4;
                g.gain.setValueAtTime(0.3, nextTime);
                g.gain.exponentialRampToValueAtTime(0.001, nextTime+dur);
                osc.connect(g); g.connect(bassGain);
                osc.start(nextTime); osc.stop(nextTime+dur);
            }

            // ── Double bass kick: low-frequency thump ──
            if (KICK_PAT[patIdx % KICK_PAT.length]) {
                const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
                osc.type='sine'; osc.frequency.setValueAtTime(150, nextTime);
                osc.frequency.exponentialRampToValueAtTime(35, nextTime+0.08);
                g.gain.setValueAtTime(0.35, nextTime);
                g.gain.exponentialRampToValueAtTime(0.001, nextTime+0.15);
                osc.connect(g); g.connect(kickGain);
                osc.start(nextTime); osc.stop(nextTime+0.15);
            }

            // ── Lead guitar: square wave through distortion ──
            const mf = LEAD_PAT[patIdx % LEAD_PAT.length];
            if (mf > 0) {
                const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
                osc.type='square'; osc.frequency.value=mf;
                const dur=MUSIC_STEP*0.7;
                g.gain.setValueAtTime(0.25, nextTime);
                g.gain.exponentialRampToValueAtTime(0.001, nextTime+dur);
                osc.connect(g); g.connect(leadGain);
                osc.start(nextTime); osc.stop(nextTime+dur);
            }

            // ── Cymbal crash ──
            if (CYMBAL_PAT[patIdx % CYMBAL_PAT.length]) {
                const bs=audioCtx.createBufferSource(); bs.buffer=_getNoiseBuf();
                const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4500;
                const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=8000; bp.Q.value=1.2;
                const bg=audioCtx.createGain();
                bg.gain.setValueAtTime(0.18, nextTime);
                bg.gain.exponentialRampToValueAtTime(0.001, nextTime+0.6);
                bs.connect(hp); hp.connect(bp); bp.connect(bg); bg.connect(musicGain);
                bs.start(nextTime); bs.stop(nextTime+0.6);
            }

            nextTime += MUSIC_STEP;
            stepIdx++;
        }
        setTimeout(sched, 250);
    }
    sched();
}
