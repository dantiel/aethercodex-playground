<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent Black Hole with Relativistic Accretion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Drag to rotate • Wheel to zoom • Click to add stars</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;
        
        // Black hole parameters
        const blackHoleRadius = 40;
        const blackHoleMass = 1000;
        const G = 1;
        const speedOfLight = 10;
        
        // Camera parameters
        let cameraX = 0;
        let cameraY = 0;
        let cameraZ = 1000;
        let zoomFactor = 1.0;
        let cameraRotation = 0;
        let cameraRotationY = 0;
        
        // Background stars - ALL AROUND the black hole
        const stars = [];
        for (let i = 0; i < 2500; i++) {
            // Create stars in all directions around the black hole
            const radius = 800 + Math.random() * 1200;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1); // Uniform sphere distribution
            
            stars.push({
                x: radius * Math.sin(phi) * Math.cos(theta),
                y: radius * Math.sin(phi) * Math.sin(theta),
                z: radius * Math.cos(phi),
                size: Math.random() * 1.5 + 0.05,
                brightness: Math.random() * 0.6 + 0.14
            });
        }
        
        // Matter particles for emergent accretion disk - MANY MORE particles
        const matterParticles = [];
        for (let i = 0; i < 8000; i++) {
            // Much higher density closer to black hole - realistic distribution
            const distance = blackHoleRadius * 1.5 + Math.pow(Math.random(), 4) * blackHoleRadius * 12;
            const densityFactor = Math.max(0.4, 1 - (distance - blackHoleRadius * 1.5) / (blackHoleRadius * 12));
            
            if (Math.random() < densityFactor) {
                const angle = Math.random() * Math.PI * 2;
                const orbitalVelocity = Math.sqrt(G * blackHoleMass / distance);
                const relativisticFactor = Math.min(1, orbitalVelocity / speedOfLight);
                
                matterParticles.push({
                    x: Math.cos(angle) * distance,
                    y: (Math.random() - 0.5) * distance * 0.03, // MUCH thinner vertical spread
                    z: Math.sin(angle) * distance,
                    vx: -Math.sin(angle) * orbitalVelocity,
                    vy: (Math.random() - 0.5) * 0.003, // Much smaller vertical velocities
                    vz: Math.cos(angle) * orbitalVelocity,
                    temperature: 8000000 + (blackHoleRadius * 15 / distance) * 5000,
                    mass: 1,
                    size: 0.7 + Math.random() * 0.12,
                    relativisticFactor: relativisticFactor,
                    history: []
                });
            }
        }
        
        // Mouse controls
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                cameraRotation += deltaX * 0.01;
                cameraRotationY = Math.max(-Math.PI/3, Math.min(Math.PI/3, cameraRotationY + deltaY * 0.01));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                
                render();
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            console.log({ cameraRotationY,  cameraRotation });
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('click', (e) => {
            // Add a star at click position
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left - canvas.width/2) * 10;
            const y = (e.clientY - rect.top - canvas.height/2) * 10;
            const z = 1000;
            
            stars.push({
                x: x,
                y: y,
                z: z,
                size: 3,
                brightness: 1
            });
            render();
        });
        
        // Add zoom functionality
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomFactor *= Math.exp(-e.deltaY * 0.001);
            zoomFactor = Math.max(0.1, Math.min(5.0, zoomFactor));
            render();
        });
        
        // CONSISTENT gravitational lensing function for both stars and accretion disk
        function calculateLensing(x, y, z) {
            const distance = Math.sqrt(x*x + y*y + z*z);
            if (distance < blackHoleRadius) return null; // Inside black hole
            
            // Consistent deflection formula for all objects - SAME for stars and accretion disk
            // Reduce lensing radius to match accretion disk
            const deflection = (4 * G * blackHoleMass) / (distance * 3.14159);
            
            // Calculate apparent position (light bends TOWARD black hole)
            const angle = Math.atan2(y, x);
            const apparentDistance = distance * (1 - deflection * Math.exp(-distance / (blackHoleRadius * 1.5)));
            
            return {
                x: Math.cos(angle) * apparentDistance,
                y: Math.sin(angle) * apparentDistance,
                z: z
            };
        }
        
        function updateMatterPhysics() {
            matterParticles.forEach(particle => {
                // Store position history for curved relativistic lines (last 5 positions for smoother curves)
                if (!particle.history) particle.history = [];
                particle.history.unshift({x: particle.x, y: particle.y, z: particle.z});
                if (particle.history.length > 5) particle.history.pop();
                
                // Store last position for velocity calculations
                particle.lastX = particle.x;
                particle.lastY = particle.y;
                particle.lastZ = particle.z;
                
                // Store previous position for relativistic effects
                particle.lastX = particle.x;
                particle.lastY = particle.y;
                particle.lastZ = particle.z;
                
                // Calculate distance to black hole
                const dx = -particle.x;
                const dy = -particle.y;
                const dz = -particle.z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                if (distance > blackHoleRadius*6) {
                    // Gravitational acceleration with relativistic corrections
                    const force = G * blackHoleMass / (distance * distance);
                    particle.vx += (dx / distance) * force;
                    particle.vy += (dy / distance) * force;
                    particle.vz += (dz / distance) * force;
                    
                    // Update position
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.z += particle.vz;
                    
                    // Update relativistic factor based on speed
                    const speed = Math.sqrt(particle.vx*particle.vx + particle.vy*particle.vy + particle.vz*particle.vz);
                    particle.relativisticFactor = Math.min(1, speed / speedOfLight);
                    
                    // Increase temperature closer to black hole
                    particle.temperature = 800 + (blackHoleRadius * 15 / distance) * 5000;
                } else {
                    // Particle fell into black hole - respawn with realistic distribution
                    const distance = blackHoleRadius * 1.5 + Math.pow(Math.random(), 4) * blackHoleRadius * 10;
                    const densityFactor = Math.max(0.4, 1 - (distance - blackHoleRadius * 1.5) / (blackHoleRadius * 10));
                    // console.log(distance);
                    if (Math.random() < densityFactor) {
                        const angle = Math.random() * Math.PI * 2*1.2;
                        const orbitalVelocity = Math.sqrt(G * blackHoleMass / distance);
                        
                        particle.x = Math.cos(angle) * distance;
                        particle.y = (Math.random() - 0.5) * distance * 0.03;
                        particle.z = Math.sin(angle) * distance;
                        particle.vx = -Math.sin(angle) * orbitalVelocity;
                        particle.vy = (Math.random() - 0.5) * 0.003;
                        particle.vz = Math.cos(angle) * orbitalVelocity;
                        particle.temperature = 800 + (blackHoleRadius * 15 / distance) * 5000;
                        particle.relativisticFactor = Math.min(1, orbitalVelocity / speedOfLight);
                        particle.history = []; // Clear history on respawn
                    }
                }
            });
        }
        
        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update matter physics
            updateMatterPhysics();
            
            // Draw emergent accretion disk from matter particles WITH LENSING AND RELATIVISTIC EFFECTS
            matterParticles.forEach(particle => {
                // Transform to camera space with both horizontal and vertical rotation
                const cosRotX = Math.cos(cameraRotation);
                const sinRotX = Math.sin(cameraRotation);
                const cosRotY = Math.cos(cameraRotationY);
                const sinRotY = Math.sin(cameraRotationY);
                
                // First rotate around Y axis (horizontal)
                const tempX = particle.x * cosRotX - particle.z * sinRotX;
                const tempZ = particle.x * sinRotX + particle.z * cosRotX;
                
                // Then rotate around X axis (vertical)
                const transformedY = particle.y * cosRotY - tempZ * sinRotY;
                const transformedZ = particle.y * sinRotY + tempZ * cosRotY;
                const transformedX = tempX;
                
                // Transform previous position for relativistic lines
                const tempLastX = particle.lastX * cosRotX - particle.lastZ * sinRotX;
                const tempLastZ = particle.lastX * sinRotX + particle.lastZ * cosRotX;
                const transformedLastY = particle.lastY * cosRotY - tempLastZ * sinRotY;
                const transformedLastZ = particle.lastY * sinRotY + tempLastZ * cosRotY;
                const transformedLastX = tempLastX;
                
                // Calculate lensing for accretion disk particles
                const apparent = calculateLensing(transformedX, transformedY, transformedZ);
                const apparentLast = calculateLensing(transformedLastX, transformedLastY, transformedLastZ);
                
                if (apparent && apparentLast) {
                    // Project to screen with zoom factor
                    const scale = cameraZ / (cameraZ + apparent.z) * zoomFactor;
                    const screenX = canvas.width/2 + apparent.x * scale;
                    const screenY = canvas.height/2 + apparent.y * scale;
                    
                    const scaleLast = cameraZ / (cameraZ + apparentLast.z) * zoomFactor;
                    const screenLastX = canvas.width/2 + apparentLast.x * scaleLast;
                    const screenLastY = canvas.height/2 + apparentLast.y * scaleLast;
                    
                    // Color based on temperature and relativistic effects
                    const hue = Math.min(60, particle.temperature / 100);
                    const saturation = Math.min(100, particle.temperature / 50);
                    const brightness = 30 + particle.relativisticFactor * 70;
                    
                    // Draw relativistic motion lines for fast-moving particles
                    // Use predictive orbital arcs for continuous appearance across all viewing angles
                    //if (particle.relativisticFactor > 0.4 && particle.history && particle.history.length >= 3) {
                    if (particle.relativisticFactor > 0.0 && particle.history && particle.history.length >= 3) {
                        ctx.strokeStyle = `hsl(${hue}, ${saturation}%, ${brightness}%)`;
                        ctx.lineWidth = particle.size * (1 + particle.relativisticFactor * 2);
                        ctx.beginPath();
                        
                        // Calculate orbital parameters for predictive arcs
                        const currentPos = particle.history[particle.history.length - 1];
                        const prevPos = particle.history[particle.history.length - 2];
                        const prevPrevPos = particle.history[particle.history.length - 3];
                        
                        // Calculate velocity and acceleration vectors
                        const vx = currentPos.x - prevPos.x;
                        const vy = currentPos.y - prevPos.y;
                        const vz = currentPos.z - prevPos.z;
                        
                        const prevVx = prevPos.x - prevPrevPos.x;
                        const prevVy = prevPos.y - prevPrevPos.y;
                        const prevVz = prevPos.z - prevPrevPos.z;
                        
                        const ax = vx - prevVx;
                        const ay = vy - prevVy;
                        const az = vz - prevVz;
                        
                        // const threshold =2.2
                        // if (threshold < vx* vx + vy* vy + vz* vz) {
                        //   return;
                        // }
                        // vy Draw predictive orbital arc
                        const steps = 2;
                        for (let step = 0; step < steps; step++) {
                            const t = step / steps;
                            
                            // Predict position using quadratic interpolation (position + velocity + acceleration)
                            const predictedX = currentPos.x + vx * t + ax * t * t * 0.5;
                            const predictedY = currentPos.y + vy * t + ay * t * t * 0.5;
                            const predictedZ = currentPos.z + vz * t + az * t * t * 0.5;
                            
                            // Transform and lens predicted position
                            const tempX = predictedX * cosRotX - predictedZ * sinRotX;
                            const tempZ = predictedX * sinRotX + predictedZ * cosRotX;
                            const transformedY = predictedY * cosRotY - tempZ * sinRotY;
                            const transformedZ = predictedY * sinRotY + tempZ * cosRotY;
                            const transformedX = tempX;
                            
                            const apparent = calculateLensing(transformedX, transformedY, transformedZ);
                            
                            if (apparent) {
                                const scale = cameraZ / (cameraZ + apparent.z) * zoomFactor;
                                const x = canvas.width/2 + apparent.x * scale;
                                const y = canvas.height/2 + apparent.y * scale;
                                
                                if (step === 0) {
                                    ctx.moveTo(x, y);
                                }
                                ctx.lineTo(x, y);
                            }
                        }
                        ctx.stroke();
                    } else {
                        // Draw as small dots for slower particles
                        ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${brightness}%)`;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, particle.size, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            });
            
            
            // Draw stars with PROPER lensing
            stars.forEach(star => {
                // Transform star to camera space with both horizontal and vertical rotation
                const cosRotX = Math.cos(cameraRotation);
                const sinRotX = Math.sin(cameraRotation);
                const cosRotY = Math.cos(cameraRotationY);
                const sinRotY = Math.sin(cameraRotationY);
                
                // First rotate around Y axis (horizontal)
                const tempX = star.x * cosRotX - star.z * sinRotX;
                const tempZ = star.x * sinRotX + star.z * cosRotX;
                
                // Then rotate around X axis (vertical)
                const transformedY = star.y * cosRotY - tempZ * sinRotY;
                const transformedZ = star.y * sinRotY + tempZ * cosRotY;
                const transformedX = tempX;
                
                // Calculate lensing
                const apparent = calculateLensing(transformedX, transformedY, transformedZ);
                
                if (apparent) {
                    // Project to screen with zoom factor
                    const scale = cameraZ / (cameraZ + apparent.z) * zoomFactor;
                    const screenX = canvas.width/2 + apparent.x * scale;
                    const screenY = canvas.height/2 + apparent.y * scale;
                    
                    // Draw apparent position (bright)
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, star.size, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    // Draw actual position (faint)
                    const actualScale = cameraZ / (cameraZ + transformedZ) * zoomFactor;
                    const actualX = canvas.width/2 + transformedX * actualScale;
                    const actualY = canvas.height/2 + star.y * actualScale;
                    
                    ctx.fillStyle = `rgba(128, 128, 128, ${star.brightness * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(actualX, actualY, star.size * 0.5, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    // Draw connection line
                    ctx.strokeStyle = `rgba(128, 128, 128, ${star.brightness * 0.2})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(actualX, actualY);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();
                }
            });
        }
        
        // Animation loop
        function animate() {
            render();
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
